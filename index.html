<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Takeda IBD Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: top header + left workspace nav + page area. The AI engagement engine page holds the live scoring demo (presenter bar + sub-tabs). Single light theme by choice, to match the client deck. */
:root{
  --bg:#f7f4f4; --surface:#ffffff; --surface-2:#faf6f6; --line:#ece2e3; --line-2:#ddcdcf;
  --fg:#26171a; --muted:#6b5458; --faint:#9b878a;
  --brand:#9e0f24; --brand-fg:#ffffff; --accent:#c8102e; --accent-soft:#fbe8eb; --accent-line:#f0bcc4;
  --good:#2e7d5b; --good-deep:#1e5a40; --good-soft:#e7f4ed; --good-line:#a8d5bf;
  --bad:#b4232c; --bad-soft:#fbe9ea; --purple:#7b2d6b; --purple-soft:#f5e8f2;
  --warn:#9a5b00; --warn-soft:#fff3df; --blue:#2f5d8a; --blue-soft:#e8f0f8;
  --display:"Sora",ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;
  --r:12px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;border:0;background:none;padding:0}
.brandmark .tk{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);letter-spacing:-.02em}
.brandmark .ma{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-left:1px solid var(--line-2);padding-left:12px}
.ptitle{display:flex;flex-direction:column;line-height:1.15}
.ptitle b{font-family:var(--display);font-size:14px}
.ptitle span{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--good-deep);background:var(--good-soft);border:1px solid var(--good-line);padding:5px 10px;border-radius:999px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:ping 1.8s infinite}
.user{display:flex;align-items:center;gap:9px}
.user .av2{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.user b{display:block;font-size:13px}
.user span{font-size:11.5px;color:var(--muted)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 58px)}
.ws{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.ws .lab{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--faint);padding:4px 10px 8px}
.ws button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.ws button:hover{background:var(--surface-2);color:var(--fg)}
.ws button[aria-current="page"]{background:var(--accent-soft);color:var(--brand)}
.ws button:focus-visible{outline:2px solid var(--accent)}
.ws svg{width:18px;height:18px;flex:none}
.ws .bdg{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--accent);color:#fff}
.ws .bdg.ai{background:var(--fg)}
.content{min-width:0;padding-inline:24px;padding-block:18px 36px;display:flex;flex-direction:column;gap:16px}
.crumb{font-size:12px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:600}
.phd{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.phd h1{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.015em}
.phd p{color:var(--muted);margin-top:4px;max-width:70ch}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.period{font-size:12.5px;font-weight:700;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface)}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:var(--surface);max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card>h3{font-size:15px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card>.sub{font-size:12px;color:var(--muted);margin:2px 0 12px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px}
.kp6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;text-decoration:none}
button.kpi{cursor:pointer;text-align:left;font:inherit}
button.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .s .up,.up{color:var(--good);font-weight:700}
.kpi.up .v{color:var(--good)} .kpi.down .v{color:var(--bad)}
.dn{color:var(--bad);font-weight:700}
.prio{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.prio.High{background:var(--accent-soft);color:var(--brand)}
.prio.Medium{background:var(--warn-soft);color:var(--warn)}
.prio.Low{background:#eef0f2;color:#4d5862}
.ini{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:700;font-size:11.5px;flex:none}
.who3{display:flex;gap:10px;align-items:center}
.who3 b{display:block;font-weight:600}
.who3 span{font-size:11.5px;color:var(--muted)}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.brief{display:flex;flex-direction:column;gap:10px}
.brief button{all:unset;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.brief button:hover{border-color:var(--accent)}
.brief .n{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.brief b{display:block;font-size:13px}
.brief span{font-size:12px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.hb .tr{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.hb .tr span{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heat{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px}
.heat td{text-align:center;border-radius:6px;padding:9px 4px;font-family:var(--mono);font-weight:700}
.heat th{font-weight:600;color:var(--muted);font-size:11.5px;text-align:center;padding:2px}
.heat th:first-child{text-align:left}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{background:var(--surface-2);text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover{background:var(--surface-2)}
.sigt{display:flex;flex-direction:column}
.sg{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:start}
.sg:last-child{border-bottom:0}
.sg.new{animation:slide .6s ease}
.sg .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;font-family:var(--mono)}
.sg .ty{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sg b{display:block;margin:1px 0}
.sg .d{font-size:12.5px;color:var(--muted)}
.sg .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.tog{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;cursor:pointer}
.tog input{accent-color:var(--good);width:16px;height:16px}
.steps{display:flex;flex-direction:column;gap:8px}
.stp{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;transition:background .3s,border-color .3s}
.stp .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--mono);font-weight:700;font-size:12px;color:var(--muted)}
.stp b{display:block;font-size:13.5px}
.stp small{color:var(--muted);font-size:12px}
.stp .st2{font-size:11.5px;font-weight:700;color:var(--faint)}
.stp.run{border-color:var(--accent);background:var(--accent-soft)}
.stp.run .n{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite;color:transparent}
.stp.ok{border-color:var(--good-line);background:var(--good-soft)}
.stp.ok .n{background:var(--good);color:#fff;border-color:var(--good)}
.stp.ok .st2{color:var(--good-deep)}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.mets div{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.mets b{display:block;font-family:var(--display);font-size:20px;font-weight:800}
.mets span{font-size:11.5px;color:var(--muted)}
.wt{display:flex;flex-direction:column}
.wt div{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.wt div:last-child{border-bottom:0}
.wt .tr{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.wt .tr span{display:block;height:100%;background:var(--accent)}
.fe{display:flex;flex-direction:column;gap:8px}
.fe div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 10px;border-radius:10px;background:var(--surface-2)}
.fe .n{width:26px;height:26px;border-radius:7px;background:var(--fg);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;font-family:var(--mono)}
.fe b{display:block;font-size:13px}
.fe span{font-size:12px;color:var(--muted)}
.etabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.etabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:center}
.etabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--accent)}
.etabs button:focus-visible{outline:2px solid var(--accent)}
.livepill{font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--good);color:#fff;border-radius:999px;padding:1px 7px}
.cta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft));border:1px solid var(--accent-line);border-radius:var(--r);padding:14px 16px}
.cta b{font-family:var(--display);font-size:15px;color:var(--brand);display:block}
.cta span{font-size:12.5px;color:var(--muted)}
.hlist{display:flex;flex-direction:column;gap:4px}
.hlist button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600}
.hlist button:hover{background:var(--surface-2)}
.hlist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--brand)}
.scorebox{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:10px;align-items:center}
.sb{border-radius:12px;padding:14px;text-align:center}
.sb.a{background:var(--surface-2);border:1px solid var(--line)}
.sb.b{background:var(--good-soft);border:1px solid var(--good-line)}
.sb .k{font-size:11.5px;color:var(--muted);font-weight:600}
.sb .n{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.1}
.sb.b .n{color:var(--good-deep)}
.sb .c{font-size:11.5px;color:var(--muted)}
.drv{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.drv div{display:grid;grid-template-columns:minmax(0,1fr) 52px 44px;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-2);font-size:13px}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.rec .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:12px}
.rec b{display:block;font-size:13.5px}
.rec span{font-size:12px;color:var(--muted)}
.rec.done{background:var(--good-soft);border-color:var(--good-line)}
.prob{display:flex;flex-direction:column;gap:10px}
.prob div{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center}
.prob b{font-size:13px}
.prob small{grid-column:1 / -1;font-size:11.5px;color:var(--muted)}
.prob .tr{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.prob .tr span{display:block;height:100%;background:var(--good)}
.ms{display:flex;flex-direction:column;gap:8px}
.ms div{display:flex;gap:10px;align-items:center;font-size:13px;padding:8px 10px;border-radius:9px;background:var(--surface-2)}
.ms i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.opp{display:flex;flex-direction:column;gap:8px}
.opp div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.opp b{display:block;font-size:13.5px}
.opp span{font-size:12px;color:var(--muted)}
.opp div.gap{border-color:#efc9cc;background:#fffafa}
.ev2{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ev2:last-child{border-bottom:0}
.ev2 .dt{border-radius:10px;background:var(--accent);color:#fff;text-align:center;padding:6px 0;font-family:var(--display);line-height:1.05}
.ev2 .dt b{display:block;font-size:18px} .ev2 .dt span{font-size:10.5px;font-weight:700}
.ev2 strong{display:block;font-size:13.5px}
.ev2 small{color:var(--muted);font-size:12px}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.prof .pic{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--accent-line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:var(--brand)}
.prof h2{font-size:24px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.pscores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pubs{display:flex;flex-direction:column}
.pubs div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pubs div:last-child{border-bottom:0}
.pubs b{font-size:13.5px}
.pubs small{color:var(--muted);font-size:12px}
.ver{font-size:11px;font-weight:700;color:var(--good-deep);background:var(--good-soft);border-radius:999px;padding:2px 8px;align-self:start}
svg.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- live demo (inside AI engagement engine) ---------- */
.dbar{position:sticky;top:58px;z-index:20;background:rgb(247 244 244 / .94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live.on{color:var(--good);border-color:var(--good-line)}
.live.on i{background:var(--good);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgb(46 125 91 / .55)}100%{box-shadow:0 0 0 9px rgb(46 125 91 / 0)}}
.clock{font-size:12px;color:var(--muted);display:flex;flex-direction:column;line-height:1.2}
.clock b{color:var(--fg);font-size:12.5px}
.dbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 10px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}

/* simple SVG line chart */
function lineChart({labels,series,ymax,ymin=0,w=560,h=220,fmt=v=>v,area=false}){
 const L=40,R=14,T=14,B=28;
 const x=i=>L+(w-L-R)*(labels.length===1?0:i/(labels.length-1)),y=v=>T+(h-T-B)*(1-(v-ymin)/(ymax-ymin));
 let g='';for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4;g+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="#efe6e7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(Math.round(v*10)/10)}</text>`;}
 labels.forEach((l,i)=>{g+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle">${esc(l)}</text>`;});
 const s=series.map(se=>{const d=se.values.map((v,i)=>`${i?'L':'M'}${x(i)} ${y(v)}`).join(' ');
  const ar=area?`<path d="${d} L${x(se.values.length-1)} ${y(ymin)} L${x(0)} ${y(ymin)}Z" fill="${se.color}" opacity=".10"/>`:'';
  const last=se.values.length-1;
  return `${ar}<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.2"/>${se.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===last?4.5:3}" fill="${se.color}" stroke="#fff" stroke-width="${i===last?2:0}"><title>${esc(se.name)} · ${esc(labels[i])}: ${v}</title></circle>`).join('')}<text x="${x(last)-6}" y="${y(se.values[last])-9}" text-anchor="end" style="font-weight:700;fill:${se.color}">${fmt(se.values[last])}</text>`;}).join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))}">${g}${s}</svg>`+(series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'');
}

 shell:()=>`<div class="dhead"><div><span class="eyebrow">IBD · 50 HCPs in pilot cohort</span><h2>Territory overview</h2><p>The quarterly alignment decile (1 Oct refresh) sits next to the dynamic decile, which updates with every new signal.</p></div></div>

  <div class="grid" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)" id="tgrid">
   <div class="card"><h3>HCPs per decile <small class="muted small" style="font-family:var(--body);font-weight:500">alignment vs dynamic</small></h3><div id="dchart"></div></div>
   <div class="card"><h3>Biggest movers since refresh <small class="muted small" style="font-family:var(--body);font-weight:500">click to open</small></h3><div id="movers"></div></div></div>
  <div class="tools"><input class="search" id="q" type="search" placeholder="Search HCP, institution, region" aria-label="Search HCPs" value="${esc(S.q)}"><label class="chk"><input type="checkbox" id="mov"${S.moversOnly?' checked':''}>Movers only</label><span style="flex:1"></span><span class="small muted" id="cnt"></span></div>
  <div class="tablewrap"><table class="dt"><thead><tr>${[['name','HCP'],['region','Region'],['align','Alignment'],['dyn','Dynamic'],['delta','Change'],['score','Score'],['sig','Signals'],['drv','Top driver'],['last','Last signal']].map(([k,l])=>`<th><button type="button" data-sort="${k}">${l}${S.sort.k===k?(S.sort.dir<0?' ↓':' ↑'):''}</button></th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div>`,
 update(){
  const up=HCPS.filter(h=>h.dynDec>h.alignDec).length,dn=HCPS.filter(h=>h.dynDec<h.alignDec).length;
  $('kpis').innerHTML=`<div class="kpi"><span class="l">HCPs in scope</span><span class="v num">${HCPS.length}</span><span class="s">IBD pilot cohort</span></div>
   <div class="kpi up"><span class="l">Moved up</span><span class="v num">${up}</span><span class="s">dynamic &gt; alignment</span></div>
   <div class="kpi down"><span class="l">Moved down</span><span class="v num">${dn}</span><span class="s">dynamic &lt; alignment</span></div>
   <div class="kpi"><span class="l">Signals since refresh</span><span class="v num">${S.events.length}</span><span class="s">${new Set(S.events.map(e=>e.src)).size} sources contributing</span></div>
   <div class="kpi"><span class="l">Last signal</span><span class="v num" data-ago>${ago(S.lastReal)}</span><span class="s">quarterly model: 1 Oct</span></div>`;
  $('dchart').innerHTML=decileChart();
  const mv=[...HCPS].filter(h=>h.signals.length).sort((a,b)=>Math.abs(b.dyn-b.align)-Math.abs(a.dyn-a.align)).slice(0,5);
  $('movers').innerHTML=mv.length?`<div class="health">${mv.map(h=>`<div style="cursor:pointer" data-hcp="${h.id}"><span><b>${esc(h.name)}</b><br><span class="small muted">${esc(h.practice)} · ${h.signals.length} signals</span></span><span style="display:flex;gap:8px;align-items:center"><span class="dpill a">${h.alignDec}</span>→<span class="dpill d${h.dynDec<h.alignDec?' dn':''}">${h.dynDec}</span><span class="pts ${h.dyn<h.align?'neg':''}">${fmtPts(h.dyn-h.align)}</span></span></div>`).join('')}</div>`
   :`<div class="empty"><b>No movement yet</b>Press “Start live feed” to stream signals from CRM, PubMed, trials and more.</div>`;
  this.table();
 },
 table(){
  const q=S.q.toLowerCase();
  let rows=HCPS.filter(h=>(!q||(h.name+h.inst+h.region+h.practice+h.spec).toLowerCase().includes(q))&&(!S.moversOnly||h.dynDec!==h.alignDec));
  const key={name:h=>h.name,region:h=>h.region,align:h=>h.alignDec*1000+h.align,dyn:h=>h.dynDec*1000+h.dyn,delta:h=>(h.dynDec-h.alignDec)*1000+(h.dyn-h.align),score:h=>h.dyn,sig:h=>h.signals.length,drv:h=>h.uplift,last:h=>h.signals[0]?h.signals[0].t:0}[S.sort.k];
  rows.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*S.sort.dir||b.align-a.align;});
  const now=Date.now();
  $('tb').innerHTML=rows.map(h=>{const f=S.flash[h.id];const fl=f&&now-f.at<1200;
   return `<tr data-hcp="${h.id}" class="${fl?'flash'+(f.neg?' neg':''):''}"><td><div class="nm">${esc(h.name)}</div><div class="sub">${esc(h.spec)} · ${esc(h.practice)}</div></td>
   <td>${esc(h.region)}</td><td><span class="dpill a">${h.alignDec}</span></td><td><span class="dpill d${h.dynDec<h.alignDec?' dn':''}">${h.dynDec}</span></td>
   <td>${deltaHtml(h)}</td><td class="num small">${h.align.toFixed(1)} → <b>${h.dyn.toFixed(1)}</b></td><td class="num">${h.signals.length}</td><td class="small">${topDriver(h)}</td><td class="small muted">${h.signals[0]?fmtT(h.signals[0].t):'—'}</td></tr>`;}).join('')||`<tr><td colspan="9" class="empty">No HCPs match this search.</td></tr>`;
  $('cnt').textContent=`${rows.length} of ${HCPS.length} HCPs`;
  setTimeout(()=>document.querySelectorAll('tr.flash').forEach(r=>r.classList.remove('flash','neg')),900);
 },
 after(){$('q').oninput=e=>{S.q=e.target.value;VIEWS.territory.table();};$('mov').onchange=e=>{S.moversOnly=e.target.checked;VIEWS.territory.table();};}
};
function decileChart(){
 const a=Array(10).fill(0),d=Array(10).fill(0);HCPS.forEach(h=>{a[h.alignDec-1]++;d[h.dynDec-1]++;});
 const max=Math.max(4,...a,...d),top=Math.ceil(max/4)*4;
 const W=560,H=210,L=30,B=30,T=14,cw=(W-L-10)/10,bw=cw*.34,y=v=>T+(H-T-B)*(1-v/top);
 let g='';for(let t=0;t<=top;t+=top/4){g+=`<line x1="${L}" x2="${W-10}" y1="${y(t)}" y2="${y(t)}" stroke="#efe6e7"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;}
 let bars='';for(let i=0;i<10;i++){const x=L+i*cw+cw/2;
  bars+=`<rect x="${x-bw-1}" y="${y(a[i])}" width="${bw}" height="${y(0)-y(a[i])}" rx="2" fill="#f0bcc4"><title>Decile ${i+1} alignment: ${a[i]}</title></rect><rect x="${x+1}" y="${y(d[i])}" width="${bw}" height="${y(0)-y(d[i])}" rx="2" fill="#2e7d5b"><title>Decile ${i+1} dynamic: ${d[i]}</title></rect><text x="${x}" y="${H-12}" text-anchor="middle">${i+1}</text>`;}
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="HCP count per decile">${g}${bars}<text x="${W/2}" y="${H}" text-anchor="middle">Decile</text></svg><div class="legend"><span><i style="background:#f0bcc4"></i>Alignment (quarterly)</span><span><i style="background:#2e7d5b"></i>Dynamic (real-time)</span></div>`;
}
VIEWS.feed={
 shell:()=>`<div class="dhead"><div><span class="eyebrow">Streaming ingestion</span><h2>Live signal feed</h2><p>Each event is matched to an HCP, stored, and rescored in the deterministic scoring service. No LLM is involved in the score.</p></div></div>
  <div class="feedgrid"><div class="card"><h3>Incoming signals <small class="small muted" style="font-family:var(--body);font-weight:500" id="fcount"></small></h3><div class="feed" id="feed"></div></div>
   <div class="grid"><div class="card"><h3>Processing pipeline <small class="small muted" style="font-family:var(--body);font-weight:500">lights up per event</small></h3><div class="pipe" style="margin-top:10px">
     <div class="stage" id="P1"><span class="n">1</span><span><b>Ingest event</b><small>Kinesis / EventBridge</small></span></div>
     <div class="stage" id="P2"><span class="n">2</span><span><b>Resolve identity to NPI</b><small>OneKey master · name + affiliation matching</small></span></div>
     <div class="stage" id="P3"><span class="n">3</span><span><b>Update features</b><small>SageMaker Feature Store (online)</small></span></div>
     <div class="stage" id="P4"><span class="n">4</span><span><b>Deterministic rescoring</b><small>Lambda / Step Functions · weights + uplift</small></span></div>
     <div class="stage" id="P5"><span class="n">5</span><span><b>Decile change and alert</b><small>Dashboard · CRM write-back · rep alert</small></span></div></div></div>
    <div class="card"><h3>Source health</h3><div class="health" id="health" style="margin-top:6px"></div></div></div></div>`,
 update(){
  $('feed').innerHTML=S.events.length?S.events.slice(0,40).map(e=>evRow(e)).join(''):`<div class="empty"><b>Waiting for signals</b>Press “Start live feed” or “Next signal” in the bar above.</div>`;
  $('fcount').textContent=`${S.events.length} since 1 Oct refresh`;
  $('health').innerHTML=['veeva','pubmed','ctgov','congress','omni','social'].map(k=>`<div><span>${srcBadge(k)}</span><span class="num small">${fmtN(S.rec[k])}</span><span class="small muted" style="min-width:86px;text-align:right">${S.lastSrc[k]?fmtD(S.lastSrc[k]):'no events yet'}</span></div>`).join('');
 }
};
VIEWS.hcp={
 shell:()=>`<div class="dhead"><div><span class="eyebrow">AI-powered IBD Scientific Engagement Score</span><h2>HCP 360</h2></div>
   <div class="picker">${HEROES.map(h=>`<button type="button" class="chip" data-pick="${h.id}" aria-pressed="${S.sel===h.id}">${esc(h.name.replace('Dr. ',''))}</button>`).join('')}
   <select class="sel" id="hsel" aria-label="Choose any HCP">${HCPS.map(h=>`<option value="${h.id}"${S.sel===h.id?' selected':''}>${esc(h.name)}</option>`).join('')}</select></div></div>
  <div class="card hero" id="hero"></div>
  <div class="cols3"><div class="card"><h3>Quarterly alignment model <small class="small muted" style="font-family:var(--body);font-weight:500">static · 1 Oct</small></h3><div id="cats"></div>
    <p class="note">Six scored categories (${WSUM}% of weight), normalised. “Other Strategic Factors” (20%) is defined during discovery.</p></div>
   <div class="card"><h3>Why this score <small class="small muted" style="font-family:var(--body);font-weight:500">exact contributions</small></h3><div id="why"></div></div>
   <div class="card"><h3>Dynamic real-time inputs <small class="small muted" style="font-family:var(--body);font-weight:500">since refresh</small></h3><div id="sigs"></div></div></div>`,
 update(){
  const h=byId(S.sel);const d=h.dynDec-h.alignDec,cls=d>0?'':d<0?' down':' flat';
  const segs=n=>Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
  $('hero').innerHTML=`<div class="who"><div class="av">${ini(h.name)}</div><div><h2>${esc(h.name)}, ${esc(h.cred)}</h2><p>${esc(h.spec)} · ${esc(h.practice)}</p><p>${esc(h.inst)} · ${esc(h.region)}</p><p><span class="badge src-pubmed">${esc(h.tag)}</span> <span class="num small muted">NPI ${h.npi}</span></p></div></div>
   <div class="big a"><span class="k">Alignment_Model_Decile</span><span class="n num">${h.alignDec}</span><div class="segs">${segs(h.alignDec)}</div><span class="sc">Score <b class="num">${h.align.toFixed(1)}</b> · unchanged until next refresh</span></div>
   <div class="arrow">${ic('right')}</div>
   <div class="big d${d<0?' dn':''}"><span class="k">Dynamic_Model_Output</span><span class="n num">${h.dynDec}</span><div class="segs">${segs(h.dynDec)}</div><span class="sc">Score <b class="num">${h.dyn.toFixed(1)}</b> · updated ${h.signals[0]?fmtD(h.signals[0].t):'—'}</span></div>
   <div class="verdict${cls}"><b>${d>0?`Increased from ${h.alignDec} → ${h.dynDec}`:d<0?`Decreased from ${h.alignDec} → ${h.dynDec}`:`Holding at decile ${h.alignDec}`}</b><span>${d>0?'High recent scientific engagement and influence.':d<0?'Negative recent peer sentiment is pulling engagement down.':h.signals.length?'New signals have not yet changed the decile.':'No new signals since the quarterly refresh.'}</span></div>`;
  $('cats').innerHTML=CATS.map((c,i)=>`<div class="catrow"><b>${esc(c.name)}</b><span class="w">${c.w}%</span><div class="bars"><span>Score</span><div class="meter"><span style="width:${h.scores[i]}%"></span></div><span class="num" style="min-width:24px;text-align:right;color:var(--fg)">${h.scores[i]}</span><span class="num" style="min-width:58px;text-align:right;color:var(--accent)">+${(h.scores[i]*c.w/WSUM).toFixed(1)} pts</span></div><div class="it">${esc(c.items)}</div></div>`).join('');
  const g={};h.signals.forEach(e=>{const k=TYPES[e.type].group;g[k]=(g[k]||0)+e.pts;});
  const parts=CATS.map((c,i)=>({n:c.name,v:h.scores[i]*c.w/WSUM,c:CAT_COLORS[i]})).concat(Object.entries(g).map(([k,v])=>({n:k,v,c:GROUP_COLORS[k]})));
  let room=100;const stack=parts.map(p=>{const w=Math.max(0,Math.min(room,p.v));room-=w;return `<span title="${esc(p.n)}: ${p.v.toFixed(1)}" style="width:${w}%;background:${p.c}"></span>`;}).join('');
  const neg=Object.values(g).filter(v=>v<0).reduce((a,b)=>a+b,0);
  $('why').innerHTML=`<div class="stack">${stack}</div><div class="legend">${parts.filter(p=>Math.abs(p.v)>.05).map(p=>`<span><i style="background:${p.c}"></i>${esc(p.n)} ${p.v<0?'−':''}${Math.abs(p.v).toFixed(1)}</span>`).join('')}</div>
   <div class="eq"><span>${h.align.toFixed(1)}</span><span class="${h.uplift>=0?'g':'b'}">${fmtPts(h.uplift)}</span><span>=</span><span>${h.dyn.toFixed(1)}</span><span class="small muted" style="font-family:var(--body);font-weight:500">alignment + real-time uplift = dynamic</span></div>
   ${neg<0?`<p class="small" style="color:var(--bad)">Negative signals: ${fmtPts(neg)} pts</p>`:''}<div style="margin-top:12px">${timeline(h)}</div>
   <div class="nba" style="margin-top:12px"><b>Suggested next best action</b>${nba(h)}</div>`;
  const cnt={};h.signals.forEach(e=>{const k=TYPES[e.type].label+(e.type==='social'?(e.sent>0?' · positive':' · negative'):'');cnt[k]=cnt[k]||{n:0,p:0};cnt[k].n++;cnt[k].p+=e.pts;});
  $('sigs').innerHTML=h.signals.length?`<div class="sigsum">${Object.entries(cnt).map(([k,v])=>`<div><span><b class="num">${v.n}×</b> ${esc(k)}</span><span class="pts ${v.p<0?'neg':''}">${fmtPts(v.p)}</span></div>`).join('')}</div><div class="evlist">${h.signals.map(e=>evRow(e,false)).join('')}</div>`
   :`<div class="empty"><b>No new signals yet</b>Start the live feed. ${h.hero?'Scripted signals for this HCP arrive in the first minute.':'Random signals may reach this HCP.'}</div>`;
 },
 after(){$('hsel').onchange=e=>{S.sel=e.target.value;dmount();};}
};
function timeline(h){
 const W=520,H=170,L=30,R=26,T=12,B=26;const t1=Math.max(S.clock,START+7*DAY);
 const x=t=>L+(W-L-R)*(t-START)/(t1-START),y=v=>T+(H-T-B)*(1-v/100);
 let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#efe6e7"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;});
 const days=Math.ceil((t1-START)/DAY);const step=days>20?7:days>8?3:1;
 for(let dd=0;dd<=days;dd+=step){g+=`<text x="${x(START+dd*DAY)}" y="${H-6}" text-anchor="middle">${fmtD(START+dd*DAY)}</text>`;}
 let p=`M${x(START)} ${y(h.hist[0].v)}`;h.hist.slice(1).forEach(pt=>{p+=` H${x(pt.t)} V${y(pt.v)}`;});p+=` H${x(S.clock)}`;
 const dots=h.hist.slice(1).map(pt=>`<circle cx="${x(pt.t)}" cy="${y(pt.v)}" r="3" fill="#2e7d5b"/>`).join('');const last=h.hist[h.hist.length-1];
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score over time">${g}<line x1="${x(START)}" x2="${x(S.clock)}" y1="${y(h.align)}" y2="${y(h.align)}" stroke="#c8102e" stroke-dasharray="5 4" stroke-width="1.5"/><path d="${p}" fill="none" stroke="#2e7d5b" stroke-width="2.2"/>${dots}<circle cx="${x(S.clock)}" cy="${y(last.v)}" r="4.5" fill="#2e7d5b" stroke="#fff" stroke-width="2"/></svg>
  <div class="legend"><span><i style="background:#c8102e"></i>Alignment score (frozen)</span><span><i style="background:#2e7d5b"></i>Dynamic score</span></div>`;
}
function nba(h){const d=h.dynDec-h.alignDec;
 if(d>=3)return 'Prioritise for an MSL scientific follow-up within 2 weeks and consider for the next IBD advisory board. Flag to the brand team as an emerging influencer.';
 if(d>0)return 'Schedule an MSL follow-up on the topics raised in recent discussions. Monitor for further publication activity.';
 if(d<0)return 'Review recent peer sentiment with the MSL team before the next engagement. The quarterly alignment decile is kept until the next refresh.';
 return 'No change in priority. Continue the planned engagement cadence.';}
VIEWS.ask={
 shell:()=>`<div class="dhead"><div><span class="eyebrow">Investigator agent · scripted for this demo</span><h2>Ask AI</h2><p>Every answer is built from the live score data and cites the source events. In production this is the Bedrock Investigator Agent with guardrails.</p></div></div>
  <div class="askgrid"><div class="card" style="display:flex;flex-direction:column"><div class="chat" id="chat"></div>
   <form class="askform" id="askf"><input id="askq" autocomplete="off" placeholder="Ask about an HCP, a decile change, or the data sources" aria-label="Question"><button class="btn primary" type="submit">Ask</button></form></div>
   <div class="card"><h3>Try asking</h3><div class="sugg" style="margin-top:10px">
    <button type="button" data-ask="Why did Dr. Jane Smith move up?">Why did Dr. Jane Smith move up?</button>
    <button type="button" data-ask="Which HCPs moved up the most since the refresh?">Which HCPs moved up the most since the refresh?</button>
    <button type="button" data-ask="Why is Dr. Marcus Hale going down?">Why is Dr. Marcus Hale going down?</button>
    <button type="button" data-ask="Who are the top-priority HCPs right now?">Who are the top-priority HCPs right now?</button>
    <button type="button" data-ask="What data sources feed this score?">What data sources feed this score?</button></div><p class="note">Tip: start the live feed first, so the answers have signals to cite.</p></div></div>`,
 update:null,
 after(){renderChat();$('askf').onsubmit=e=>{e.preventDefault();const q=$('askq').value.trim();if(q){ask(q);$('askq').value='';}};}
};
function renderChat(){const c=$('chat');if(!c)return;
 c.innerHTML=S.chat.length?S.chat.map(m=>m.role==='u'?`<div class="msg u">${esc(m.text)}</div>`:`<div class="msg a"><span class="who2">Investigator agent</span>${m.pending?'<span class="typing"><i></i><i></i><i></i> Analysing signals and evidence…</span>':m.html}</div>`).join('')
  :`<div class="empty"><b>Ask why any HCP's score changed</b>Pick a suggested question or type your own.</div>`;
 const last=c.lastElementChild;if(last&&S.chat.length)last.scrollIntoView({block:'nearest',behavior:'smooth'});}
function ask(q){S.chat.push({role:'u',text:q});const m={role:'a',pending:true};S.chat.push(m);renderChat();setTimeout(()=>{m.pending=false;m.html=answer(q);renderChat();},1300);}
const cite=e=>`<button type="button" class="cite" data-cite="${e.id}">${e.id}</button>`;
function trace(steps){return `<details class="trace"><summary>Agent trace · ${steps.length} steps · guardrails passed</summary><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></details>`;}
function explain(h){
 const head=`<p><b>${esc(h.name)}</b> (${esc(h.inst)}, ${esc(h.region)}): alignment decile <b>${h.alignDec}</b> (score ${h.align.toFixed(1)}), unchanged since the 1 Oct quarterly refresh. Dynamic decile is now <b>${h.dynDec}</b> (score ${h.dyn.toFixed(1)}).</p>`;
 if(!h.signals.length)return head+`<p>There are no new signals for this HCP since the refresh, so the dynamic score equals the alignment score. Start the live feed to stream new signals.</p>`+trace([`Query Agent: intent <code>explain_score</code>, entity ${esc(h.name)} (NPI ${h.npi})`,`Scoring Agent: <code>get_score_breakdown</code> → no uplift`,`Guardrail Agent: <span class="ok">✓</span> no claims without evidence`]);
 const g={};h.signals.forEach(e=>{const k=TYPES[e.type].label+(e.type==='social'?(e.sent>0?' (positive)':' (negative)'):'');(g[k]=g[k]||{n:0,p:0,ev:[]});g[k].n++;g[k].p+=e.pts;g[k].ev.push(e);});
 const items=Object.entries(g).sort((a,b)=>Math.abs(b[1].p)-Math.abs(a[1].p));
 const dir=h.dynDec>h.alignDec?'moved up':h.dynDec<h.alignDec?'moved down':'has new signals but has not changed decile';
 const srcs=new Set(h.signals.map(e=>SOURCES[e.src].name));
 return head+`<p>The HCP ${dir} because of <b>${h.signals.length} new signals</b> (total ${fmtPts(h.uplift)} pts):</p><ul>${items.map(([k,v])=>`<li><b>${v.n}× ${esc(k)}</b>, ${fmtPts(v.p)} pts ${v.ev.slice(0,3).map(cite).join('')}</li>`).join('')}</ul><p>Largest driver: <b>${esc(items[0][0])}</b>. Suggested action: ${nba(h)}</p>`+
  trace([`Query Agent: intent <code>explain_score</code>, entity ${esc(h.name)} (NPI ${h.npi})`,`Scoring Agent: <code>get_score_breakdown</code> → alignment ${h.align.toFixed(1)}, uplift ${fmtPts(h.uplift)}, dynamic ${h.dyn.toFixed(1)}`,`Evidence Agent: <code>get_recent_signals</code> → ${h.signals.length} events from ${[...srcs].join(', ')}`,`Guardrail Agent: <span class="ok">✓</span> every claim cited · <span class="ok">✓</span> no PHI · <span class="ok">✓</span> no clinical advice`]);
}
function answer(q){
 const s=q.toLowerCase();
 const h=HCPS.find(x=>{const p=x.name.toLowerCase().replace('dr. ','').split(' ');return s.includes(p[1])||s.includes(p.join(' '));});
 if(h)return explain(h);
 if(/source|data|feed/.test(s))return `<p>The score combines quarterly batch data with streaming signals:</p><ul>${Object.values(SOURCES).map(v=>`<li><b>${esc(v.name)}</b>: ${esc(v.kind)} · ${v.mode==='batch'?'quarterly batch':v.mode==='optional'?'optional, pending usage rights':'near real-time'}</li>`).join('')}</ul><p>All records resolve to an NPI through the OneKey master before scoring.</p>`+trace(['Query Agent: intent <code>describe_lineage</code>','Evidence Agent: <code>list_sources</code> → '+Object.keys(SOURCES).length+' sources','Guardrail Agent: <span class="ok">✓</span> no PHI']);
 if(/mov|rose|up the most|change/.test(s)){const mv=HCPS.filter(x=>x.signals.length).sort((a,b)=>(b.dyn-b.align)-(a.dyn-a.align)).slice(0,5).filter(x=>x.dyn>x.align);
  if(!mv.length)return `<p>No HCP has moved since the 1 Oct refresh yet. Start the live feed and ask again.</p>`;
  return `<p>Top ${mv.length} upward movers since the 1 Oct refresh:</p><ul>${mv.map(x=>`<li><b>${esc(x.name)}</b> (${esc(x.practice)}): decile ${x.alignDec} → ${x.dynDec}, ${fmtPts(x.dyn-x.align)} pts ${cite(x.signals[0])}</li>`).join('')}</ul>`+trace(['Query Agent: intent <code>rank_movers</code>, window since refresh','Segmentation Agent: <code>rank_by_delta</code> over '+HCPS.length+' HCPs','Evidence Agent: latest event per HCP','Guardrail Agent: <span class="ok">✓</span> every claim cited']);}
 if(/top|priority|decile 10|best/.test(s)){const tp=[...HCPS].sort((a,b)=>b.dyn-a.dyn).slice(0,5);
  return `<p>Top ${tp.length} HCPs by dynamic score right now:</p><ul>${tp.map(x=>`<li><b>${esc(x.name)}</b>: dynamic decile ${x.dynDec} (score ${x.dyn.toFixed(1)}), alignment decile ${x.alignDec}${x.signals[0]?' '+cite(x.signals[0]):''}</li>`).join('')}</ul>`+trace(['Query Agent: intent <code>top_priority</code>','Segmentation Agent: <code>rank_by_dynamic_score</code>','Guardrail Agent: <span class="ok">✓</span> no clinical advice']);}
 return `<p>This demo answers questions about HCP score changes, movers, top priorities and data sources. Try one of the suggested questions.</p><p class="muted small">In the full platform, open questions are answered by the Bedrock Investigator Agent, grounded in the knowledge base and graph, with cited evidence.</p>`;
}
const SYNCING={};
VIEWS.sources={
 shell:()=>`<div class="dhead"><div><span class="eyebrow">Unified HCP data · medical, commercial, external, digital</span><h2>Data sources</h2><p>Streaming sources update the dynamic score between quarters. Batch sources feed the quarterly alignment model.</p></div><button class="btn" type="button" data-act="rerun">Re-run connection check</button></div><div class="srcgrid" id="srcgrid"></div>`,
 update(){
  $('srcgrid').innerHTML=Object.entries(SOURCES).map(([k,v])=>{const sy=SYNCING[k];
   const st=sy?'<span class="stat sync">Syncing…</span>':v.mode==='batch'?'<span class="stat batch">Quarterly batch</span>':v.mode==='optional'?'<span class="stat opt">Optional · rights pending</span>':'<span class="stat ok">● Streaming</span>';
   return `<div class="card src"><div class="top2"><div><h4>${esc(v.name)}</h4><span class="k">${esc(v.kind)}</span></div>${st}</div><span class="rec2 num">${fmtN(S.rec[k])}</span><span class="k" style="margin-top:-6px">records</span>
    <div class="meta"><span>Last update: ${v.mode==='batch'?'1 Oct 2026':S.lastSrc[k]?fmtT(S.lastSrc[k]):'1 Oct 2026'}</span><button class="btn sm" type="button" data-sync="${k}"${sy?' disabled':''}>Sync now</button></div></div>`;}).join('');
 }
};
VIEWS.arch={
 shell:()=>`<div class="dhead"><div><span class="eyebrow">Target solution · subject to Discovery approval</span><h2>Multi-agent AI architecture</h2><p>Each live signal flows up through these layers. Start the feed to watch it.</p></div></div>
  <div class="commit"><span>Deterministic scoring outside the LLM</span><span>Full evidence citation</span><span>Guardrail-enforced agent outputs</span><span>Near real-time segmentation</span><span>Human governance at every gate</span></div>
  <div class="layers">${[['L1','1 · User layer','Commercial reps · MSLs · Brand teams','Rep portal, MSL chat, dashboards','This app: dashboards, HCP 360, Ask AI'],
   ['L2','2 · Gateway & identity','AWS WAF + CloudFront · API Gateway · Cognito (SSO, RBAC, MFA)','Edge security, single API entry','Single-page app; role-based views in the pilot'],
   ['L3','3 · Orchestration','Bedrock multi-agent orchestrator · Guardrails · Agent Trace · HITL','Plan, reason, orchestrate, monitor','“Agent trace” panel in Ask AI'],
   ['L4','4 · Specialist agents','Query · Scoring · Segmentation · Evidence · Guardrail','Scoring Agent calls the deterministic scoring service','Rules engine computing weights + uplift'],
   ['L5','5 · Intelligence & retrieval','Claude on Bedrock · Knowledge Bases (OpenSearch) · Neptune graph · SageMaker Feature Store','Features, RAG, HCP relationships','In-memory feature store per HCP'],
   ['L6','6 · Enterprise data','Veeva CRM · Claims & Rx · PubMed & ClinicalTrials.gov · OneKey · S3 + Lake Formation','Governed gold layer','Synthetic data for 50 HCPs, simulated stream']
  ].map(([id,n,c,sub,demo])=>`<div class="layer" id="${id}"><div class="lh"><b>${n}</b><small>${esc(sub)}</small></div><div class="comp">${c.split(' · ').map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="demo"><b>In this demo</b>${esc(demo)}</div></div>`).join('')}</div>
  <p class="small muted">Cross-cutting: security (IAM, KMS), HIPAA / GxP governance, CloudWatch monitoring, FinOps budgets, multi-AZ resilience.</p>`,
 update:null
};
function boot(){
 const list=['onekey','align','veeva','claims','rx','pubmed','ctgov','congress','omni'];
 const b=$('boot');b.hidden=false;
 b.innerHTML=`<div class="bootbox"><span class="eyebrow" style="color:#ffd0d7">AI engagement engine · live dynamic scoring (synthetic data)</span><h2>Connecting to enterprise data sources</h2><p>Loading the quarterly alignment model and building unified HCP profiles.</p>
  <div class="blist">${list.map((k,i)=>`<div class="bl" id="b${i}"><span class="st"></span><span>${esc(SOURCES[k].name)}</span><span class="c num" id="bc${i}">waiting</span></div>`).join('')}<div class="bl" id="bx"><span class="st"></span><span>Unified HCP profiles and scores</span><span class="c num" id="bcx">waiting</span></div></div>
  <div class="row"><button class="btn" type="button" id="bgo" hidden>Open live scoring</button><button class="btn ghost" type="button" id="bskip">Skip</button></div></div>`;
 let i=0,done=false;const finish=()=>{if(done)return;done=true;b.hidden=true;};
 $('bskip').onclick=finish;
 const stepB=()=>{if(done)return;
  if(i>0){$('b'+(i-1)).className='bl done';$('bc'+(i-1)).textContent=fmtN(S.rec[list[i-1]])+' records';}
  if(i<list.length){$('b'+i).className='bl on';$('bc'+i).textContent='syncing…';i++;setTimeout(stepB,360);}
  else{$('bx').className='bl on';$('bcx').textContent='scoring…';setTimeout(()=>{if(done)return;$('bx').className='bl done';$('bcx').textContent=HCPS.length+' HCPs scored';$('bgo').hidden=false;$('bskip').hidden=true;$('bgo').onclick=finish;$('bgo').focus();},700);}};
 setTimeout(stepB,350);
}

/* =====================================================================
   Global events
   ===================================================================== */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-route],[data-hcpp],[data-explore],[data-top],[data-sigf],[data-etab],[data-rech],[data-rechgo],[data-plan],[data-planprof],[data-engage],[data-livejane],[data-act],[data-speed],[data-go],[data-hcp],[data-cite],[data-pick],[data-sort],[data-ask],[data-sync],[data-close]');
 if(!t)return;
 const d=t.dataset;
 if(d.route){ST.etab=d.route==='engine'?'overview':ST.etab;nav(d.route);}
 else if(d.hcpp){nav('hcp-'+d.hcpp);}
 else if(d.explore!==undefined){const [p,,r]=d.explore.split('|');ST.ex={region:r||'',spec:'',prio:p||'',inst:'',score:'',pubs:'',trials:false};nav('explorer');}
 else if(d.top){ST.dash.top=d.top;document.querySelectorAll('[data-top]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.top===d.top)));dashUpdate();}
 else if(d.sigf){ST.sig.filter=d.sigf;document.querySelectorAll('[data-sigf]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sigf===d.sigf)));sigUpdate();}
 else if(d.etab){ST.etab=d.etab;nav(d.etab==='live'?'engine-live':'engine');}
 else if(d.rech){ST.rec.hcp=+d.rech;render();}
 else if(d.rechgo){ST.rec.hcp=+d.rechgo<=8?+d.rechgo:1;nav('recommendations');}
 else if(d.plan){ST.rec.done[d.plan]=true;render();toastMsg('Engagement action added to the plan');}
 else if(d.planprof){toastMsg(`Engagement plan started for ${mh(d.planprof).name}`);}
 else if(d.engage){toastMsg(`Engagement request sent to the MSL team for ${mh(d.engage).name}`);t.disabled=true;t.textContent='Requested ✓';}
 else if(d.livejane!==undefined){S.sel='jane';S.page='hcp';ST.etab='live';nav('engine-live');}
 else if(d.act==='export'){toastMsg('Report export is not available in this demo');}
 else if(d.act==='xreset'){ST.ex={region:'',spec:'',prio:'',inst:'',score:'',pubs:'',trials:false};render();}
 else if(d.act==='simsig'){simSignal();}
 else if(d.act==='runeng'){runEngine();}
 else if(d.act==='play'){setRunning(!S.running);}
 else if(d.act==='step'){processEv(nextEvent());}
 else if(d.act==='dreset'){dReset(t);}
 else if(d.act==='rerun'){boot();}
 else if(d.speed){S.speed=+d.speed;updateBar();}
 else if(d.go){dgo(d.go);}
 else if(d.cite){e.stopPropagation();openEvidence(d.cite);}
 else if(d.hcp){S.sel=d.hcp;dgo('hcp');}
 else if(d.pick){S.sel=d.pick;dmount();}
 else if(d.sort){const k=d.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='name'||k==='region'?1:-1};dmount();}
 else if(d.ask){ask(d.ask);}
 else if(d.sync){const k=d.sync;SYNCING[k]=true;drefresh();setTimeout(()=>{SYNCING[k]=false;S.rec[k]+=SOURCES[k].mode==='batch'?0:Math.floor(3+Math.random()*40);drefresh();toastMsg(`${SOURCES[k].name} synced`);},1300);}
 else if(d.close!==undefined){closeDrawer();}
});
document.addEventListener('change',e=>{
 const id=e.target.id,v=e.target.value;
 if(id==='d-region'){ST.dash.region=v;dashUpdate();}
 else if(id==='d-spec'){ST.dash.spec=v;dashUpdate();}
 else if(id==='d-period'){ST.dash.period=v;toastMsg(`Showing ${v.toLowerCase()}`);}
 else if(id.startsWith('x-')){const k={'x-region':'region','x-spec':'spec','x-prio':'prio','x-inst':'inst','x-score':'score','x-pubs':'pubs','x-trials':'trials'}[id];ST.ex[k]=id==='x-trials'?e.target.checked:v;exUpdate();}
 else if(id==='l-region'){ST.lb.region=v;lbUpdate();}
 else if(id==='l-sort'){ST.lb.sort=v;lbUpdate();}
 else if(id==='s-live'){ST.sig.live=e.target.checked;sigLoop();toastMsg(ST.sig.live?'Live feed enabled':'Live feed paused');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();});
setInterval(()=>document.querySelectorAll('[data-ago]').forEach(el=>el.textContent=ago(S.lastReal)),1000);

initState();parseHash();render();
</script>
