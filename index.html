<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>IBD Scientific Engagement Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Visual system mirrors the manager's Lovable app (navy sidebar, Takeda red, Manrope). One live store drives every page. */
:root{
  --background:oklch(0.975 0.003 255); --foreground:oklch(0.27 0.035 260); --card:oklch(1 0 0);
  --primary:oklch(0.49 0.19 22); --primary-foreground:oklch(1 0 0); --secondary:oklch(0.956 0.006 255);
  --accent:oklch(0.97 0.016 20); --muted-foreground:oklch(0.55 0.025 260); --border:oklch(0.914 0.008 260);
  --success:oklch(0.51 0.13 160); --success-soft:oklch(0.963 0.022 160); --warning:oklch(0.62 0.13 75); --warning-soft:oklch(0.974 0.03 83);
  --sidebar:oklch(0.225 0.041 260); --sidebar-foreground:oklch(0.78 0.017 260); --sidebar-muted:oklch(0.56 0.025 260);
  --chart-2:oklch(0.48 0.055 257); --chart-soft:oklch(0.83 0.065 18); --map-land:oklch(0.915 0.008 260);
  --purple:oklch(0.45 0.12 330); --purple-soft:oklch(0.96 0.02 330); --blue-soft:oklch(0.95 0.02 250);
  --shadow:0 2px 5px oklch(0.25 0.025 260 / 0.025);
  --font:"Manrope",ui-sans-serif,"Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;border-color:var(--border)}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--background);color:var(--foreground)}
body{margin:0;font-family:var(--font);font-size:13px;line-height:1.45}
button,a,input,select{font:inherit;color:inherit}
a{text-decoration:none} button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted-foreground)}
.positive{color:var(--success)} .negative{color:var(--primary)}

/* shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--sidebar);color:var(--sidebar-foreground);display:flex;flex-direction:column;z-index:40;overflow-y:auto}
.brand{min-height:91px;padding:22px 25px;display:flex;align-items:center;gap:12px;border-bottom:1px solid color-mix(in oklch,var(--sidebar-foreground) 10%,transparent)}
.takeda{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-style:italic;color:#fff;font-size:29px;line-height:1;border-bottom:2px solid #fff;padding-bottom:3px;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.brand-side{font-size:9px;border-left:1px solid var(--sidebar-muted);padding-left:12px;line-height:1.6;text-transform:uppercase;letter-spacing:1px}
.workspace{padding:24px 24px 14px}
.workspace strong{display:block;color:#fff;font-size:13px}
.workspace span{font-size:11px;display:block;margin-top:5px;color:var(--sidebar-muted)}
.nav-label{padding:10px 25px;font-size:9px;letter-spacing:1.5px;color:var(--sidebar-muted);font-weight:700}
.nav-link{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 16px;margin:2px 12px;border-radius:5px;font-size:11.5px;font-weight:500;transition:background .2s}
.nav-link svg{width:17px;height:17px;opacity:.8;flex:none}
.nav-link:hover{background:color-mix(in oklch,var(--sidebar-foreground) 8%,transparent)}
.nav-link.active{background:var(--primary);color:#fff}
.nav-link:focus-visible{outline:2px solid #fff}
.nav-count{margin-left:auto;background:color-mix(in oklch,#fff 12%,transparent);padding:2px 6px;border-radius:3px;font-size:9px}
.nav-count.live{background:var(--success);color:#fff}
.sidebar-bottom{margin-top:auto;padding:20px 24px}
.demo-status{display:flex;align-items:center;gap:7px;font-size:10px;margin-bottom:18px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex:none}
.status-dot.live{animation:blink 1.2s infinite}
.status-dot.idle{background:var(--muted-foreground)}
@keyframes blink{50%{opacity:.35}}
.sidebar-user{border-top:1px solid color-mix(in oklch,var(--sidebar-foreground) 12%,transparent);padding-top:16px;display:flex;align-items:center;gap:10px}
.sidebar-user strong{font-size:11px;color:#fff;display:block}
.sidebar-user small{font-size:9px;color:var(--sidebar-muted)}
.user-avatar{background:var(--secondary);color:var(--foreground);display:flex;align-items:center;justify-content:center;width:33px;height:33px;border-radius:50%;font-size:10px;font-weight:700;flex:none}
.main-shell{margin-left:238px;width:calc(100% - 238px)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 28px;background:var(--card);border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap}
.breadcrumb{font-size:11px;color:var(--muted-foreground);display:flex;align-items:center;gap:8px}
.breadcrumb strong{color:var(--foreground);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:5px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted-foreground);background:var(--background)}
.livepill.on{color:var(--success);border-color:color-mix(in oklch,var(--success) 40%,var(--border));background:var(--success-soft)}
.clock{font-size:10px;color:var(--muted-foreground);line-height:1.2;display:flex;flex-direction:column}
.clock b{color:var(--foreground);font-size:11px;font-weight:700}
.icon-btn{position:relative;border:0;background:none;width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--muted-foreground)}
.icon-btn:hover{background:var(--secondary)}
.icon-btn svg{width:17px;height:17px}
.notif-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--primary)}
.popover{position:absolute;right:0;top:42px;width:330px;z-index:70;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:0 10px 40px color-mix(in oklch,var(--foreground) 15%,transparent)}
.popover p{padding-top:10px;font-size:11px;line-height:1.6}
.mobile-menu{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:600;white-space:nowrap;color:var(--foreground)}
.btn:hover{border-color:var(--chart-soft);background:var(--accent)}
.btn svg{width:13px;height:13px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{height:26px;padding:0 9px;font-size:10px}
.btn:disabled{opacity:.5;cursor:default}

/* page */
.content{padding:28px 32px;max-width:1680px;margin:auto;animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.page-heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{display:flex;gap:7px;align-items:center;font-size:9px;color:var(--primary);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px}
h1{font-size:26px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.page-description{font-size:11.5px;color:var(--muted-foreground);margin-top:6px}
.heading-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.filter-group{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.filter-group select,.filter-input{height:34px;background:var(--card);border:1px solid var(--border);border-radius:5px;padding:0 10px;font-size:11px;max-width:100%}
.filter-input{min-width:210px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:11px}
.chk input{accent-color:var(--primary)}
.live-label{font-size:10px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:13px;margin-bottom:18px}
.kpi-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{all:unset;box-sizing:border-box;display:block;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 15px;border-radius:7px;transition:transform .2s,border-color .2s;min-width:0}
button.kpi{cursor:pointer}
button.kpi:hover{transform:translateY(-3px);border-color:var(--chart-soft)}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted-foreground);font-size:10px;margin-bottom:12px;gap:6px}
.kpi-icon{display:flex;width:25px;height:25px;align-items:center;justify-content:center;background:var(--secondary);border-radius:5px;color:var(--chart-2);flex:none}
.kpi-icon svg{width:13px;height:13px}
.kpi-icon.red{color:var(--primary);background:var(--accent)}
.kpi-value{font-size:27px;line-height:1;font-weight:800;margin-bottom:10px}
.kpi-value.pop{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.9);opacity:.4}}
.kpi-foot{display:flex;align-items:center;gap:4px;font-size:9.5px;color:var(--muted-foreground);flex-wrap:wrap}
.kpi-foot svg{width:10px;height:10px;color:var(--success)}
.livechip{font-size:9px;font-weight:700;background:var(--success-soft);color:var(--success);border-radius:4px;padding:1px 5px}
.livechip.neg{background:var(--accent);color:var(--primary)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:7px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 0;gap:10px}
.panel-title{font-size:12.5px;font-weight:800}
.panel-subtitle{font-size:10px;color:var(--muted-foreground);margin-top:4px}
.panel-content{padding:16px 20px}
.grid{display:grid;gap:18px;margin-bottom:18px}
.g-dash-top{grid-template-columns:.82fr 1.42fr 1.36fr}
.g-dash-bottom{grid-template-columns:1.65fr 1fr}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-live{grid-template-columns:1.2fr 1fr}
.badge{display:inline-flex;gap:4px;align-items:center;background:var(--accent);color:var(--primary);padding:4px 7px;font-size:9px;border-radius:4px;font-weight:700;white-space:nowrap}
.badge.Medium{background:var(--warning-soft);color:var(--warning)}
.badge.Low{background:var(--secondary);color:var(--muted-foreground)}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.navy{background:var(--secondary);color:var(--chart-2)}
.trend{display:inline-flex;align-items:center;gap:3px;color:var(--success);font-size:10px;font-weight:600}
.trend svg{width:11px;height:11px}
.trend.down{color:var(--primary)}
.link-action{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-size:10px;font-weight:700}
.link-action svg{width:12px;height:12px}
.link-action:hover{text-decoration:underline}
.section-footer{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted-foreground);padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.chart-legend{display:flex;gap:17px;padding:0 20px 16px;font-size:10px;color:var(--muted-foreground);flex-wrap:wrap}
.legend-dot{display:inline-block;width:7px;height:7px;background:var(--primary);border-radius:2px;margin-right:5px}
.legend-dot.secondary{background:var(--chart-2)} .legend-dot.soft{background:var(--chart-soft)} .legend-dot.green{background:var(--success)} .legend-dot.land{background:var(--map-land)}
svg.chart{display:block;width:100%}
svg.chart text{font-family:var(--font);font-size:11px;fill:var(--muted-foreground)}
.chart-wrap{padding:6px 12px 4px}
.donut-wrap{position:relative;width:148px;height:148px;margin:20px auto 16px}
.donut{width:100%;height:100%;border-radius:50%;transform:rotate(-90deg);transition:background .4s}
.donut-hole{position:absolute;inset:19px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column}
.donut-hole strong{font-size:24px;font-weight:800}
.donut-hole small{font-size:9px;color:var(--muted-foreground);margin-top:4px}
.priority-legend{display:flex;justify-content:space-between;padding:0 19px 19px;font-size:9.5px;color:var(--muted-foreground);gap:8px}
.priority-legend strong{display:block;color:var(--foreground);font-size:11px;margin-top:5px}
.region-list{padding:0 20px 14px;display:flex;justify-content:space-between;gap:8px}
.region-list span{display:block;font-size:9px;color:var(--muted-foreground)}
.region-list strong{display:block;font-size:11.5px;margin-top:4px}
.insight-panel{background:var(--accent);border-color:color-mix(in oklch,var(--primary) 15%,var(--border))}
.insight-item{padding:14px 0;border-bottom:1px solid color-mix(in oklch,var(--primary) 10%,var(--border));display:flex;gap:10px}
.insight-item:last-child{border:0}
.insight-icon{width:25px;height:25px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--primary);border-radius:5px;flex:none}
.insight-icon svg{width:13px;height:13px}
.insight-item strong{font-size:11.5px;line-height:1.6;display:block}
.insight-item p{font-size:10px;line-height:1.7;color:var(--muted-foreground);margin-top:2px}
.heatmap-grid{display:grid;grid-template-columns:105px repeat(6,1fr);gap:6px;align-items:center;font-size:10px}
.heat-label{color:var(--muted-foreground);font-size:9px}
.heat-cell{padding:9px 0;text-align:center;border-radius:3px;background:var(--accent);color:var(--primary);font-weight:600;transition:background .4s}
.heat-cell.mid{background:var(--chart-soft)}
.heat-cell.hot{background:var(--primary);color:#fff}
.live-cta{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:18px;padding:14px 18px;border-radius:12px;background:linear-gradient(100deg,var(--primary),oklch(.32 .1 260));color:#fff;box-shadow:0 10px 30px -12px var(--primary);transition:transform .2s;width:100%}
.live-cta:hover{transform:translateY(-2px)}
.live-cta>span:nth-child(2){flex:1;display:flex;flex-direction:column}
.live-cta strong{font-size:14px}
.live-cta small{opacity:.85;font-size:12px}
.live-cta-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklch,#fff 20%,transparent);animation:ring 1.8s infinite;flex:none}
.live-cta-icon svg{width:16px;height:16px}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in oklch,#fff 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* tables */
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:11px}
th{background:var(--background);font-size:9.5px;color:var(--muted-foreground);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--border)}
td{padding:11px 16px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr:hover{background:var(--background)}
tr.flash td{background:var(--success-soft)!important;transition:background 1s}
tr.flash.neg td{background:var(--accent)!important}
.physician-cell{display:flex;align-items:center;gap:9px}
.physician-cell strong{font-size:11px;display:block}
.physician-cell small{display:block;font-size:9px;color:var(--muted-foreground);margin-top:2px}
.avatar{width:29px;height:29px;background:var(--secondary);color:var(--chart-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;object-fit:cover;flex:none}
.avatar.lg{width:46px;height:46px;font-size:14px}
.score{font-weight:800;color:var(--primary)}
.dec{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 6px;border-radius:5px;font-family:var(--mono);font-size:11px;font-weight:700;background:var(--secondary);color:var(--chart-2)}
.dec.d{background:var(--success-soft);color:var(--success)}
.dec.d.dn{background:var(--accent);color:var(--primary)}
.delta{font-family:var(--mono);font-weight:700;font-size:11px}
.delta.up{color:var(--success)} .delta.dn{color:var(--primary)} .delta.eq{color:var(--muted-foreground)}

/* signals timeline */
.feed-item{padding:16px 20px;display:flex;gap:14px;border-bottom:1px solid var(--border)}
.feed-item:last-child{border-bottom:0}
.feed-item.new{animation:slidein .5s ease}
@keyframes slidein{from{transform:translateY(-8px);opacity:0;background:var(--accent)}}
.feed-icon{width:38px;height:38px;background:var(--accent);color:var(--primary);border-radius:7px;display:flex;align-items:center;justify-content:center;flex:none}
.feed-icon svg{width:18px;height:18px}
.feed-icon.Medium{background:var(--warning-soft);color:var(--warning)} .feed-icon.Low{background:var(--secondary);color:var(--chart-2)}
.feed-body{flex:1;min-width:0}
.feed-body .t{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary)}
.feed-body h3{font-size:12.5px;margin:4px 0}
.feed-body p{font-size:10.5px;color:var(--muted-foreground);line-height:1.7}
.feed-impact{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.feed-impact strong{color:var(--success);font-size:16px}
.feed-impact strong.neg{color:var(--primary)}
.feed-impact small{font-size:9.5px;color:var(--muted-foreground)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 11px;font-size:10.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.chip:hover{border-color:var(--chart-soft)}
.timeline-label{font-size:10px;color:var(--muted-foreground);padding:12px 20px;background:var(--background);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:12px}
.empty{padding:36px 20px;text-align:center;color:var(--muted-foreground);font-size:11.5px}
.empty b{display:block;color:var(--foreground);font-size:13px;margin-bottom:4px}
.coverage-row{display:flex;gap:12px;align-items:center;margin:14px 0;font-size:11px}
.coverage-row>span:first-child{width:150px;flex:none}
.coverage-track{background:var(--secondary);height:6px;flex:1;border-radius:5px;overflow:hidden}
.coverage-track div{height:100%;background:var(--primary);border-radius:5px;transition:width .5s}
.coverage-row strong{width:42px;text-align:right}

/* live feed */
.source-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.source-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--muted-foreground)}
.source-dot{width:8px;height:8px;border-radius:50%;background:var(--muted-foreground)}
.source-chip.on{color:var(--foreground)}
.source-chip.on .source-dot{background:var(--success);box-shadow:0 0 0 3px color-mix(in oklch,var(--success) 25%,transparent);animation:blink 1.4s infinite}
.stream{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:14px 18px 18px}
.stream-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:10px}
.stream-item:first-child{animation:slidein .45s ease}
.tier-pill{font-size:9px;font-weight:800;border-radius:4px;padding:3px 6px;background:var(--accent);color:var(--primary);flex:none}
.tier-pill.Medium{background:var(--warning-soft);color:var(--warning)} .tier-pill.Low{background:var(--secondary);color:var(--chart-2)}
.stream-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stream-body strong{font-size:11.5px}
.stream-body span,.stream-body small{font-size:10px;color:var(--muted-foreground)}
.stream-body a{color:var(--foreground);font-weight:600;cursor:pointer}
.stream-body a:hover{color:var(--primary)}
.stream-delta{font-weight:800;color:var(--success);font-size:13px}
.stream-delta.neg{color:var(--primary)}
.live-board{position:relative;margin:14px 18px 18px}
.live-row{position:absolute;left:0;right:0;height:40px;display:grid;grid-template-columns:34px 29px minmax(0,1fr) auto 50px 18px;gap:10px;align-items:center;padding:0 10px;border-radius:8px;transition:transform .6s cubic-bezier(.2,.8,.2,1),background .4s;cursor:pointer}
.live-row:hover{background:var(--background)}
.live-row.pulse{background:var(--success-soft)}
.live-row.pulse.neg{background:var(--accent)}
.live-rank{font-weight:800;color:var(--muted-foreground);font-size:11px}
.live-name{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-score{font-weight:800;text-align:right}
.live-move svg{width:14px;height:14px}
.explain-list{display:flex;flex-direction:column;gap:6px;padding:14px 18px 0}
.explain-list div{display:flex;justify-content:space-between;font-size:11px;padding:7px 10px;border-radius:6px;background:var(--background)}
.explain-list .total{background:var(--accent);color:var(--primary);font-weight:800}
.recency-bars{display:flex;flex-direction:column;gap:10px;padding:14px 18px 0}
.recency-bars>div{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:11px}
.recency-bars small{display:block;font-size:9px;color:var(--muted-foreground)}
.bar-track{height:7px;background:var(--secondary);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .5s}
.mini-title{font-size:11px;font-weight:800;padding:14px 18px 4px}
.alerts{display:flex;flex-direction:column;gap:8px;padding:14px 18px 18px}
.alert-item{border:1px solid color-mix(in oklch,var(--primary) 20%,var(--border));background:var(--accent);border-radius:8px;padding:10px 12px;animation:slidein .4s ease}
.alert-item strong{font-size:11.5px;color:var(--primary);display:flex;gap:6px;align-items:center}
.alert-item strong svg{width:13px;height:13px}
.alert-item p{font-size:10.5px;margin-top:3px;line-height:1.5}
.whatif{display:flex;flex-direction:column;gap:8px;padding:14px 18px 18px}
.whatif-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.whatif-item span{font-size:11px}
.whatif-item strong{font-size:16px;font-weight:800;color:var(--primary)}
.whatif-item small{font-size:10px;color:var(--muted-foreground)}
.copilot{display:flex;flex-direction:column;gap:8px;padding:14px 18px 18px}
.copilot-msg{font-size:11px;line-height:1.55;padding:9px 11px;border-radius:8px;background:var(--background);border-left:3px solid var(--primary);animation:slidein .4s ease}

/* engine */
.engine-stage{padding:13px 0;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)}
.stage-number{width:29px;height:29px;background:var(--secondary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none}
.stage-number svg{width:13px;height:13px}
.engine-stage.done .stage-number{background:var(--success-soft);color:var(--success)}
.engine-stage.current .stage-number{background:var(--accent);color:var(--primary);animation:blink 1s infinite}
.engine-stage strong{font-size:11.5px}
.engine-stage small{display:block;margin-top:3px;color:var(--muted-foreground);font-size:10px}
.engine-progress{height:5px;background:var(--secondary);margin:18px 0;border-radius:4px;overflow:hidden}
.engine-progress div{height:100%;background:var(--primary);transition:width .5s}
.hcp-metrics{display:flex;justify-content:space-between;padding:15px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);gap:8px}
.hcp-metrics span{font-size:9.5px;color:var(--muted-foreground);display:block}
.hcp-metrics strong{font-size:20px;display:block;margin-top:4px;font-weight:800}
.weight-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.weight-row:last-child{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;font-size:12px;color:var(--muted-foreground);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;color:var(--muted-foreground)}
.subtabs button[aria-current="page"]{background:var(--sidebar);border-color:var(--sidebar);color:#fff}
.livetag{font-size:9px;font-weight:800;letter-spacing:.06em;background:var(--success);color:#fff;border-radius:999px;padding:1px 7px}

/* HCP 360 (decile view) */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 36px minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:stretch;padding:18px 20px}
.who{display:flex;gap:14px;align-items:center}
.who h2{font-size:18px;font-weight:800}
.who p{color:var(--muted-foreground);font-size:11px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:12px;text-align:center}
.big.a{background:var(--secondary)} .big.d{background:var(--success-soft)} .big.d.dn{background:var(--accent)}
.big .k{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted-foreground)}
.big .n{font-size:46px;font-weight:800;line-height:1}
.big.a .n{color:var(--chart-2)} .big.d .n{color:var(--success)} .big.d.dn .n{color:var(--primary)}
.big .sc{font-size:10.5px;color:var(--muted-foreground)}
.segs{display:flex;gap:3px;width:min(100%,150px)}
.segs i{flex:1;height:6px;border-radius:2px;background:var(--border)}
.big.a .segs i.on{background:var(--chart-2)} .big.d .segs i.on{background:var(--success)} .big.d.dn .segs i.on{background:var(--primary)}
.arrow{display:grid;place-items:center;color:var(--primary)}
.arrow svg{width:26px;height:26px}
.verdict{border-radius:8px;background:var(--success);color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.verdict.flat{background:var(--chart-2)} .verdict.down{background:var(--primary)}
.verdict b{font-size:17px;line-height:1.25}
.verdict span{font-size:11px;opacity:.92}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 0;border-bottom:1px solid var(--border)}
.catrow:last-child{border-bottom:0}
.catrow b{font-size:11.5px}
.catrow .w{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--sidebar);color:#fff;border-radius:999px;padding:1px 8px;align-self:center}
.catrow .bars{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:10px;color:var(--muted-foreground)}
.meter{flex:1;height:6px;border-radius:3px;background:var(--secondary);overflow:hidden}
.meter span{display:block;height:100%;background:var(--primary)}
.stack{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--secondary);margin:14px 0 0}
.stack span{height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10px;color:var(--muted-foreground);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.eq{font-family:var(--mono);font-size:12px;font-weight:700;margin:12px 0 2px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.eq .g{color:var(--success)} .eq .b{color:var(--primary)}
.nba{border-left:3px solid var(--primary);background:var(--accent);padding:10px 12px;border-radius:0 8px 8px 0;font-size:11.5px;margin-top:12px}
.nba b{display:block;font-size:11.5px;color:var(--primary);margin-bottom:2px}
.note{font-size:10px;color:var(--muted-foreground);background:var(--background);border:1px dashed var(--border);border-radius:6px;padding:8px 10px;margin-top:10px}
.evlist{display:flex;flex-direction:column;max-height:340px;overflow:auto}
.ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ev:last-child{border-bottom:0}
.ev b{font-size:11px}
.ev small{font-size:9.5px;color:var(--muted-foreground);grid-column:1 / -1}
.evid{font-family:var(--mono);font-size:10px;color:var(--muted-foreground);border:0;background:none;padding:0;text-decoration:underline dotted;text-align:left}
.evid:hover{color:var(--primary)}

/* ask */
.askgrid{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.chat{display:flex;flex-direction:column;gap:12px;min-height:340px;padding:18px 20px}
.msg{max-width:min(720px,92%);padding:11px 14px;border-radius:12px;font-size:12px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--sidebar);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--background);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.a p+p,.msg.a p+ul,.msg.a ul+p{margin-top:8px}
.msg.a ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.who2{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:4px;display:block}
.cite{font-family:var(--mono);font-size:9.5px;font-weight:700;border:1px solid var(--chart-soft);background:var(--accent);color:var(--primary);border-radius:5px;padding:0 5px;margin-left:2px;white-space:nowrap}
.cite:hover{background:var(--primary);color:#fff}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--muted-foreground);font-size:11px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--primary);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
details.trace{margin-top:10px;border-top:1px dashed var(--border);padding-top:8px;font-size:10.5px}
details.trace summary{cursor:pointer;font-weight:700;color:var(--muted-foreground)}
.trace ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.trace code{font-family:var(--mono);font-size:10px;background:var(--secondary);padding:1px 4px;border-radius:4px}
.ok{color:var(--success);font-weight:700}
.askform{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--border)}
.askform input{flex:1;min-width:0;border:1px solid var(--border);border-radius:6px;padding:0 12px;height:36px;background:var(--background)}
.sugg{display:flex;flex-direction:column;gap:6px;padding:14px 18px 18px}
.sugg button{text-align:left;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:9px 11px;font-size:11.5px}
.sugg button:hover{border-color:var(--chart-soft);background:var(--accent)}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.src{padding:16px;display:flex;flex-direction:column;gap:7px}
.src .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.src h4{font-size:12.5px}
.src .k{font-size:10.5px;color:var(--muted-foreground)}
.src .rec{font-size:22px;font-weight:800}
.src .meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted-foreground);gap:8px;flex-wrap:wrap}
.layers{display:flex;flex-direction:column;gap:8px}
.layer{display:grid;grid-template-columns:190px minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:stretch;border:1px solid var(--border);border-radius:8px;background:var(--card);overflow:hidden;transition:box-shadow .25s,border-color .25s}
.layer .lh{background:var(--sidebar);color:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.layer .lh b{font-size:12px}
.layer .lh small{opacity:.75;font-size:10px}
.layer .comp{padding:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-content:center}
.layer .comp span{border:1px solid var(--border);border-radius:6px;padding:4px 9px;font-size:10.5px;font-weight:600;background:var(--background)}
.layer .demo{padding:10px 14px 10px 0;font-size:10.5px;color:var(--muted-foreground);display:flex;flex-direction:column;justify-content:center}
.layer .demo b{color:var(--foreground);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em}
.layer.hot{border-color:var(--success);box-shadow:0 0 0 3px color-mix(in oklch,var(--success) 25%,transparent)}
.layer.hot .lh{background:var(--success)}

/* recommendations, profile, emerging, command */
.hlist{display:flex;flex-direction:column;gap:2px;padding:12px}
.hlist button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;font-size:11.5px;font-weight:600}
.hlist button:hover{background:var(--background)}
.hlist button[aria-pressed="true"]{background:var(--accent);color:var(--primary)}
.hlist button .r{margin-left:auto;font-size:10px}
.score-evolution{padding:26px 20px;display:flex;align-items:center;justify-content:space-around;gap:12px;flex-wrap:wrap}
.score-evolution strong{font-size:52px;display:block;font-weight:800;line-height:1}
.score-evolution span{font-size:10px;color:var(--muted-foreground)}
.score-evolution svg{color:var(--muted-foreground);width:24px;height:24px}
.drivers{padding:0 20px 18px;display:flex;flex-direction:column;gap:6px}
.drivers div{display:grid;grid-template-columns:minmax(0,1fr) 56px 44px;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--background);font-size:11px}
.recommendation{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:center}
.recommendation:last-child{border-bottom:0}
.recommendation strong{font-size:11.5px;display:block}
.recommendation small{display:block;font-size:10px;color:var(--muted-foreground);margin-top:4px}
.recommendation .btn{margin-left:auto}
.rec-n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.prob{display:flex;flex-direction:column;gap:12px;padding:16px 20px}
.prob>div{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px;align-items:center}
.prob b{font-size:11.5px}
.prob small{grid-column:1 / -1;font-size:10px;color:var(--muted-foreground)}
.prob .bar-track{grid-column:1 / -1}
.prob .bar-fill{background:var(--success)}
.ms-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);font-size:11.5px}
.ms-item:last-child{border-bottom:0}
.ms-item i{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:5px}
.ms-item small{display:block;font-size:10px;color:var(--muted-foreground);margin-top:2px}
.opportunity{padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.opportunity:last-child{border-bottom:0}
.opportunity h3{font-size:11.5px}
.opportunity p{font-size:10px;line-height:1.7;color:var(--muted-foreground);margin-top:3px}
.opportunity .btn{margin-left:auto}
.event-list{padding:13px 0;border-bottom:1px solid var(--border);display:flex;gap:14px;align-items:center}
.event-list:last-child{border-bottom:0}
.event-date{background:var(--secondary);padding:8px 12px;text-align:center;border-radius:5px;flex:none}
.event-date strong{font-size:19px;display:block;font-weight:800}
.event-date span{font-size:9px;color:var(--muted-foreground)}
.event-list h3{font-size:11.5px}
.event-list p{font-size:10px;color:var(--muted-foreground);margin-top:4px}
.profile-banner{display:flex;gap:20px;align-items:center;padding:6px 0 24px;flex-wrap:wrap}
.profile-photo{width:92px;height:92px;border-radius:8px;object-fit:cover;flex:none}
.profile-initials{width:92px;height:92px;border-radius:8px;background:var(--secondary);color:var(--chart-2);display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.profile-meta{font-size:12px;color:var(--muted-foreground);margin-top:6px}
.profile-stats{margin-left:auto;display:flex;gap:28px;flex-wrap:wrap}
.profile-stats strong{font-size:28px;display:block;font-weight:800}
.profile-stats span{font-size:9.5px;color:var(--muted-foreground)}
.profile-stats small{font-size:10px}
.pub{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}
.pub:last-child{border-bottom:0}
.pub strong{font-size:11.5px;display:block}
.pub small{font-size:10px;color:var(--muted-foreground)}
.pub .badge{margin-left:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px 18px}
.tag{border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:600;background:var(--background);border:1px solid var(--border)}
.demo-footer{display:flex;justify-content:space-between;margin-top:24px;color:var(--muted-foreground);font-size:10px;gap:10px;flex-wrap:wrap}

/* overlays */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--sidebar);color:#fff;border-radius:9px;padding:10px 14px;font-size:12px;box-shadow:0 8px 24px rgb(0 0 0 / .2);display:flex;gap:10px;align-items:center;max-width:min(390px,calc(100vw - 32px));animation:tin .3s ease;cursor:pointer}
.toast.up{background:var(--success)} .toast.dn{background:var(--primary)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:90;background:var(--card);border-left:1px solid var(--border);box-shadow:-12px 0 32px rgb(0 0 0 / .12);padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto;transform:translateX(105%);transition:transform .25s ease}
.drawer.open{transform:none}
.drawer h3{font-size:16px;color:var(--primary);font-family:var(--mono)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 10px;font-size:11.5px;margin:0}
.kv dt{color:var(--muted-foreground)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
pre.raw{font-family:var(--mono);font-size:10px;background:var(--background);border:1px solid var(--border);border-radius:6px;padding:10px;overflow:auto;margin:0;white-space:pre}
.modal-backdrop{position:fixed;inset:0;background:color-mix(in oklch,var(--sidebar) 50%,transparent);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{max-width:450px;width:100%;padding:26px;background:var(--card);border-radius:8px}
.modal h2{font-size:19px;margin-bottom:16px}
.modal label{display:block;font-size:11px;margin:12px 0 6px;font-weight:600}
.modal input,.modal select,.modal textarea{border:1px solid var(--border);border-radius:5px;width:100%;padding:9px;background:var(--background)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.boot{position:fixed;inset:0;z-index:110;background:var(--sidebar);color:#fff;display:grid;place-items:center;padding:16px;overflow:auto}
.bootbox{width:min(560px,100%);display:flex;flex-direction:column;gap:14px}
.bootbox h2{font-size:22px;font-weight:800}
.bootbox p{opacity:.8}
.blist{display:flex;flex-direction:column;gap:4px;background:rgb(255 255 255 / .05);border:1px solid rgb(255 255 255 / .14);border-radius:12px;padding:10px 14px}
.bl{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;padding:5px 0;opacity:.45;transition:opacity .3s}
.bl.on,.bl.done{opacity:1}
.bl .st{width:16px;height:16px;border-radius:50%;border:2px solid rgb(255 255 255 / .4)}
.bl.on .st{border-color:#fff;border-top-color:transparent;animation:spin .7s linear infinite}
.bl.done .st{border:0;background:#4fb889;position:relative}
.bl.done .st::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.bl .c{font-family:var(--mono);font-size:11px;opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:1450px){.content{padding:32px 40px}}
@media (max-width:1280px){
  .kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g-dash-top{grid-template-columns:1fr 1.5fr}
  .g-dash-top>.panel:last-child{grid-column:1 / -1}
  .g3{grid-template-columns:1fr 1fr}
  .g3>.panel:last-child{grid-column:1 / -1}
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
  .hero .who{grid-column:1 / -1}
  .hero .arrow{display:none}
  .layer{grid-template-columns:150px minmax(0,1fr)}
  .layer .demo{grid-column:2;padding-top:0}
}
@media (max-width:1100px){

function apply(ev,quiet){
 const h=hcp(ev.hid),s=SIG[ev.key];
 const before=Object.fromEntries(ranking().map((x,i)=>[x.id,i]));
 const oldDyn=h.dyn,oldDec=dec(oldDyn),oldPrio=prio(oldDyn);
 h.uplift=r1(h.uplift+ev.delta);h.dyn=clamp(r1(h.align+h.uplift),0,100);
 h.events.unshift(ev);h.hist.push({t:ev.t,v:h.dyn});
 S.events.unshift(ev);
 S.rec[s.source]=(S.rec[s.source]||0)+1;S.lastSrc[s.source]=ev.t;S.lastReal=Date.now();
 S.prevRank=before;S.pulse={id:h.id,neg:ev.delta<0,at:Date.now()};
 S.avgHist.push({n:S.seq,v:avg()});if(S.avgHist.length>30)S.avgHist.shift();
 const newRank=ranking().findIndex(x=>x.id===h.id);
 const A=[];
 if(oldPrio!=='High'&&prio(h.dyn)==='High')A.push(['Emerging Influencer Detected',`${h.name} crossed the 80-point High priority threshold after a ${s.tier.toLowerCase()}-impact ${s.type.toLowerCase()}.`,h.id]);
 if(oldPrio==='High'&&prio(h.dyn)!=='High')A.push(['Engagement Risk Detected',`${h.name} dropped below the High priority threshold after negative peer sentiment. Review before the next exchange.`,h.id]);
 if(newRank===0&&before[h.id]!==0)A.push(['Rising KOL Identified',`${h.name} moved to #1 on the influencer leaderboard (${sgn(ev.delta)} pts).`,h.id]);
 if(ev.prior>=2&&ev.delta>0)A.push(['Scientific Activity Spike',`${ev.prior+1} signals for ${h.name} since the refresh · frequency multiplier ×${freqM(ev.prior).toFixed(2)} applied.`,h.id]);
 if(s.tier==='High'&&ev.prior===1)A.push(['Recommended Medical Affairs Engagement',`Schedule a scientific exchange with ${h.name}: repeated high-impact activity in ${h.region}.`,h.id]);
 A.forEach(a=>S.alerts.unshift({n:ev.n,title:a[0],why:a[1],hid:a[2]}));S.alerts=S.alerts.slice(0,8);S.unread+=A.length;
 S.insights=copilot();
 if(!quiet&&dec(h.dyn)!==oldDec)decToast(h,oldDec,dec(h.dyn));
}
function copilot(){
 const out=[];
 const promoted=HCPS.filter(h=>h.qPrio!=='High'&&prio(h.dyn)==='High').length;
 if(promoted)out.push(`${promoted} HCP${promoted>1?'s':''} moved into High priority since the 1 Oct refresh.`);
 const demoted=HCPS.filter(h=>h.qPrio==='High'&&prio(h.dyn)!=='High');
 if(demoted.length)out.push(`${demoted.map(h=>h.name).join(', ')} fell out of High priority. Negative peer sentiment is the driver.`);
 const pubs=S.events.filter(e=>SIG[e.key].source==='Publications Database').length;
 if(pubs)out.push(`Publication activity is ${Math.round(pubs/S.events.length*100)}% of incoming signals.`);
 const g=[...HCPS].sort((a,b)=>(b.dyn-b.align)-(a.dyn-a.align))[0];
 if(g.dyn>g.align)out.push(`${g.name} should be prioritized for scientific engagement (${sgn(g.dyn-g.align)} pts, decile ${g.alignDec} → ${dec(g.dyn)}).`);
 const by={};S.events.forEach(e=>by[GROUP[e.key]]=(by[GROUP[e.key]]||0)+e.delta);
 const d=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];if(d)out.push(`${d[0]} is the largest score driver right now.`);
 out.push(`${ranking()[0].name} currently leads the influencer leaderboard.`);
 return out;
}

/* engine control */
function tick(){if(!S.running)return;process1();S.timer=setTimeout(tick,(S.step<=SCRIPT.length?2600:2300)/S.speed);}
function process1(quiet){const ev=nextEvent();apply(ev,quiet);if(!quiet){updateChrome();liveUpdate();}}
function setRunning(on){S.running=on;clearTimeout(S.timer);if(on)S.timer=setTimeout(tick,500);updateChrome();liveUpdate(true);}
function fastForward(){
 const before=HCPS.map(h=>[h.id,dec(h.dyn)]);
 let n=0;while(S.step<SCRIPT.length){process1(true);n++;}
 const moved=before.filter(([id,d])=>dec(hcp(id).dyn)!==d).length;
 updateChrome();render();
 toastMsg(n?`Fast-forwarded ${n} signals · ${moved} HCPs changed decile`:'The scripted story has already played. New signals continue live.');
}

function smooth(pts){if(pts.length<2)return '';let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const [x0,y0]=pts[i-1]||pts[i],[x1,y1]=pts[i],[x2,y2]=pts[i+1],[x3,y3]=pts[i+2]||pts[i+1];d+=` C${x1+(x2-x0)/6} ${y1+(y2-y0)/6} ${x2-(x3-x1)/6} ${y2-(y3-y1)/6} ${x2} ${y2}`;}return d;}
function areaChart(series,labels,{h=210,ymax,gid='ga'}={}){
 const W=560,L=38,Rr=12,T=16,B=26;const mx=ymax||Math.ceil(Math.max(...series.flatMap(s=>s.values))/100)*100||10;
 const x=i=>L+(W-L-Rr)*i/(labels.length-1),y=v=>T+(h-T-B)*(1-v/mx);
 let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-dasharray="3 4"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`;}
 labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${l}</text>`);
 const body=series.map((s,si)=>{const pts=s.values.map((v,i)=>[x(i),y(v)]);const d=smooth(pts);
  return (si===0?`<path d="${d} L${x(labels.length-1)} ${y(0)} L${x(0)} ${y(0)}Z" fill="url(#${gid})"/>`:'')+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${si===0?2.5:2}"${si?' stroke-dasharray="4 4"':''}/>`+s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="9" fill="transparent"><title>${s.name} · ${labels[i]}: ${v}</title></circle>`).join('');}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(series.map(s=>s.name).join(' and '))} over time"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--primary)" stop-opacity=".18"/><stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/></linearGradient></defs>${g}${body}</svg>`;
}

function nba(h){const d=dec(h.dyn)-h.alignDec;
 if(d>=3)return 'Prioritise for an MSL scientific follow-up within 2 weeks and consider for the next IBD advisory board. Flag to the brand team as an emerging influencer.';
 if(d>0)return 'Schedule an MSL follow-up on the topics raised in recent discussions. Monitor for further publication activity.';
 if(d<0)return 'Review recent peer sentiment with the MSL team before the next engagement. The quarterly alignment decile is kept until the next refresh.';
 return 'No change in priority. Continue the planned engagement cadence.';}

 html(){return `<div class="askgrid">${panel('Investigator agent','Scripted for this demo · answers are built from the live score data and cite source events','<div class="chat" id="chat"></div><form class="askform" id="askf"><input id="askq" autocomplete="off" placeholder="Ask about an HCP, a decile change, or the data sources" aria-label="Question"><button class="btn primary" type="submit">Ask</button></form>',ic('bot','width:16px;height:16px;color:var(--primary)'))}

function renderChat(){const c=$('chat');if(!c)return;
 c.innerHTML=UI.chat.length?UI.chat.map(m=>m.role==='u'?`<div class="msg u">${esc(m.text)}</div>`:`<div class="msg a"><span class="who2">Investigator agent</span>${m.pending?'<span class="typing"><i></i><i></i><i></i> Analysing signals and evidence…</span>':m.html}</div>`).join(''):`<div class="empty"><b>Ask why any HCP's score changed</b>Pick a suggested question or type your own.</div>`;
 const last=c.lastElementChild;if(last&&UI.chat.length)last.scrollIntoView({block:'nearest',behavior:'smooth'});}
function ask(q){UI.chat.push({role:'u',text:q});const m={role:'a',pending:true};UI.chat.push(m);renderChat();setTimeout(()=>{m.pending=false;m.html=answer(q);renderChat();},1300);}
const cite=e=>`<button type="button" class="cite" data-cite="${e.id}">${e.id}</button>`;
const traceH=steps=>`<details class="trace"><summary>Agent trace · ${steps.length} steps · guardrails passed</summary><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></details>`;
function explain(h){
 const d=dec(h.dyn);
 const head=`<p><b>${esc(h.name)}</b> (${esc(h.inst)}): quarterly alignment decile <b>${h.alignDec}</b> (score ${h.align.toFixed(1)}), unchanged since the 1 Oct refresh. Live dynamic decile is <b>${d}</b> (score ${h.dyn.toFixed(1)}), rank #${rankOf(h.id)}, ${prio(h.dyn)} priority.</p>`;
 if(!h.events.length)return head+`<p>No new signals since the refresh, so the dynamic score equals the alignment score.</p>`+traceH([`Query Agent: intent <code>explain_score</code>, entity ${esc(h.name)} (NPI ${h.npi})`,`Scoring Agent: <code>get_score_breakdown</code> → no uplift`,`Guardrail Agent: <span class="ok">✓</span> no claims without evidence`]);
 const g={};h.events.forEach(e=>{const k=SIG[e.key].label;(g[k]=g[k]||{n:0,p:0,ev:[]});g[k].n++;g[k].p+=e.delta;g[k].ev.push(e);});
 const items=Object.entries(g).sort((a,b)=>Math.abs(b[1].p)-Math.abs(a[1].p));
 const dir=d>h.alignDec?'moved up':d<h.alignDec?'moved down':'has new signals but has not changed decile';
 return head+`<p>The HCP ${dir} because of <b>${h.events.length} new signals</b> (${sgn(h.uplift)} pts). Each signal = base points × source reliability × recency × frequency:</p><ul>${items.map(([k,v])=>`<li><b>${v.n}× ${esc(k)}</b>, ${sgn(v.p)} pts ${v.ev.slice(0,3).map(cite).join('')}</li>`).join('')}</ul><p>Largest driver: <b>${esc(items[0][0])}</b>. Suggested action: ${nba(h)}</p>`+
  traceH([`Query Agent: intent <code>explain_score</code>, entity ${esc(h.name)} (NPI ${h.npi})`,`Scoring Agent: <code>get_score_breakdown</code> → alignment ${h.align.toFixed(1)}, uplift ${sgn(h.uplift)}, dynamic ${h.dyn.toFixed(1)}`,`Evidence Agent: <code>get_recent_signals</code> → ${h.events.length} events from ${[...new Set(h.events.map(e=>SIG[e.key].source))].join(', ')}`,`Guardrail Agent: <span class="ok">✓</span> every claim cited · <span class="ok">✓</span> no PHI · <span class="ok">✓</span> no clinical advice`]);
}
function answer(q){
 const s=q.toLowerCase();
 const h=HCPS.find(x=>{const p=x.name.toLowerCase().replace('dr. ','').split(' ');return s.includes(p[p.length-1])||s.includes(p.join(' '));});
 if(h)return explain(h);
 if(/source|data|feed/.test(s))return `<p>The score combines quarterly batch data with streaming signals:</p><ul>${SOURCES.map(v=>`<li><b>${esc(v.name)}</b> (${esc(v.sys)}): ${esc(v.kind)} · ${v.mode==='batch'?'quarterly batch':v.mode==='optional'?'optional, pending usage rights':'near real-time'}</li>`).join('')}</ul><p>All records resolve to an NPI through the OneKey master before scoring.</p>`+traceH(['Query Agent: intent <code>describe_lineage</code>',`Evidence Agent: <code>list_sources</code> → ${SOURCES.length} sources`,'Guardrail Agent: <span class="ok">✓</span> no PHI']);
 if(/mov|rose|up the most|change|gain/.test(s)){const mv=[...HCPS].filter(x=>x.dyn>x.align).sort((a,b)=>(b.dyn-b.align)-(a.dyn-a.align)).slice(0,5);
  if(!mv.length)return `<p>No HCP has moved since the 1 Oct refresh yet. Start the live feed and ask again.</p>`;
  return `<p>Top ${mv.length} upward movers since the 1 Oct refresh:</p><ul>${mv.map(x=>`<li><b>${esc(x.name)}</b>: decile ${x.alignDec} → ${dec(x.dyn)}, ${sgn(x.dyn-x.align)} pts ${cite(x.events[0])}</li>`).join('')}</ul>`+traceH(['Query Agent: intent <code>rank_movers</code>, window since refresh',`Segmentation Agent: <code>rank_by_delta</code> over ${HCPS.length} HCPs`,'Evidence Agent: latest event per HCP','Guardrail Agent: <span class="ok">✓</span> every claim cited']);}
 if(/top|priority|decile 10|best|lead/.test(s)){const tp=ranking().slice(0,5);
  return `<p>Top ${tp.length} HCPs by live engagement score:</p><ul>${tp.map((x,i)=>`<li>#${i+1} <b>${esc(x.name)}</b>: ${engage(x)}/10, decile ${x.alignDec} → ${dec(x.dyn)}${x.events[0]?' '+cite(x.events[0]):''}</li>`).join('')}</ul>`+traceH(['Query Agent: intent <code>top_priority</code>','Segmentation Agent: <code>rank_by_dynamic_score</code>','Guardrail Agent: <span class="ok">✓</span> no clinical advice']);}
 return `<p>This demo answers questions about HCP score changes, movers, top priorities and data sources. Try one of the suggested questions.</p><p class="muted" style="font-size:11px">In the full platform, open questions are answered by the Bedrock Investigator Agent, grounded in the knowledge base and graph, with cited evidence.</p>`;
}

 html(){

  const h=hcp(UI.rec);const prev=h.align/10,now=h.dyn/10;
  const g={};h.events.forEach(e=>{const k=SIG[e.key].label;g[k]=g[k]||{n:0,p:0};g[k].n++;g[k].p+=e.delta;});
  const drivers=Object.entries(g).sort((a,b)=>Math.abs(b[1].p)-Math.abs(a[1].p));
  const acts=[['Schedule scientific exchange','Discuss evolving treatment sequencing in IBD'],['Invite to advisory board','Contribute expertise to strategic scientific discussion'],['Include in clinical initiatives','Explore research collaboration opportunities'],['Share scientific publications','Share relevant peer-reviewed IBD evidence'],['Engage at upcoming congress','Arrange a focused scientific meeting at UEG Week']];
  return heading('Results & recommendations','Turn scientific intelligence into purposeful Medical Affairs engagement.')+`
  <div class="grid" style="grid-template-columns:minmax(0,.7fr) minmax(0,2.3fr)">
   ${panel('HCPs','Live ranking · analysis complete',`<div class="hlist">${list.map(x=>`<button type="button" data-rec="${x.id}" aria-pressed="${x.id===h.id}">${avatar(x)}<span>${esc(x.name)}</span><span class="r ${x.dyn>=x.align?'positive':'negative'}">${x.dyn===x.align?'':sgn(x.dyn-x.align)}</span></button>`).join('')}</div>`)}
   <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
    <div class="grid g2" style="margin:0">
     ${panel('Scientific engagement score evolution',`${esc(h.name)} · quarterly score vs. live score`,`<div class="score-evolution"><div><span>Quarterly score (1 Oct)</span><strong class="num" style="color:var(--chart-2)">${prev.toFixed(1)}</strong><span>/10 · decile ${h.alignDec}</span></div>${ic('right')}<div><span>Updated engagement score</span><strong class="num" style="color:${now>=prev?'var(--success)':'var(--primary)'}">${now.toFixed(1)}</strong><span>/10 · decile ${dec(h.dyn)}</span></div></div>
      <div class="drivers">${drivers.length?drivers.map(([k,v])=>`<div><span>${v.n}× ${esc(k)}</span><span class="${v.p<0?'negative':'positive'} num" style="font-weight:800">${sgn(v.p/10)}</span><span class="muted num">${Math.round(Math.abs(v.p))}%</span></div>`).join('')+`<p style="font-size:11px;margin-top:6px"><b>Overall change:</b> <span class="${now>=prev?'positive':'negative'}" style="font-weight:800">${now>=prev?'+':'−'}${Math.abs(Math.round((now-prev)*10))}%</span> · <button class="link-action" type="button" data-why="${h.id}">Why? Ask the investigator ${ic('right')}</button></p>`:`<div class="empty" style="padding:16px"><b>No live signals yet for ${esc(h.name)}</b>Start the live feed to see the score evolve.</div>`}</div>`,pbadge(prio(h.dyn)))}
     ${panel('Engagement score trajectory','Since the 1 Oct quarterly refresh',`<div class="chart-wrap">${lineChart(h.hist.map(p=>({x:p.t,v:p.v/10})),{h:220,ymin:0,ymax:10,color:'var(--primary)',fmtx:t=>fmtD(t),label:'Engagement score'})}</div>`)}
    </div>
    ${panel('Recommended engagement actions','Prioritized opportunities for scientific exchange',`<div class="panel-content">${acts.map(([t,s],i)=>{const done=UI.plan[h.id+'-'+i];return `<div class="recommendation"><span class="rec-n">${i+1}</span><div><strong>${t}</strong><small>${s}</small></div><button class="btn sm${done?'':' primary'}" type="button" data-plan="${h.id}-${i}"${done?' disabled':''}>${done?'Planned ✓':'Plan'}</button></div>`;}).join('')}</div>`)}
   </div></div>`;
 }
};

/* ======================= events ======================= */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-route],[data-hcp],[data-go],[data-act],[data-cite],[data-sigf],[data-etab],[data-esub],[data-sel],[data-ask],[data-sync],[data-rec],[data-recgo],[data-plan],[data-engage],[data-schedule],[data-prof],[data-why],[data-hcp360]');
 if(!t){if(UI.popover&&!e.target.closest('#popover')){UI.popover=false;$('popover').hidden=true;}return;}
 const d=t.dataset;
 if(d.route){nav(d.route);}
 else if(d.cite){e.stopPropagation();openEvidence(d.cite);}
 else if(d.hcp){nav('hcp-'+d.hcp);}
 else if(d.go){const [r,p]=d.go.split(':');if(r==='explorer'){UI.ex={q:'',region:REGIONS.some(x=>x.name===p)?p:'',spec:'',prio:['High','Medium','Low'].includes(p)?p:'',score:'',pubs:'',trials:false};}nav(r);}
 else if(d.sigf){UI.sigf=d.sigf;document.querySelectorAll('[data-sigf]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sigf===d.sigf)));PAGES.signals.live();}
 else if(d.etab){R.etab=d.etab;nav(d.etab==='live'?'engine-live':'engine');}
 else if(d.esub){R.esub=d.esub;document.querySelectorAll('[data-esub]').forEach(b=>{if(b.dataset.esub===d.esub)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});PAGES.engine.mountSub();}
 else if(d.sel){R.sel=+d.sel;PAGES.engine.mountSub();}
 else if(d.hcp360){R.sel=+d.hcp360;R.esub='hcp360';R.etab='live';nav('engine-live');}
 else if(d.ask){ask(d.ask);}
 else if(d.why){R.esub='ask';R.etab='live';nav('engine-live');setTimeout(()=>ask(`Why did ${hcp(d.why).name} change?`),50);}
 else if(d.sync!==undefined){const i=+d.sync;SYNCING[i]=true;SUBS.sources.live();setTimeout(()=>{SYNCING[i]=false;const s=SOURCES[i];S.rec[s.name]+=s.mode==='batch'?0:Math.floor(3+Math.random()*40);if(R.esub==='sources')SUBS.sources.live();toastMsg(`${s.name} synced`);},1300);}
 else if(d.rec){UI.rec=+d.rec;render();}
 else if(d.recgo){UI.rec=+d.recgo;nav('recommendations');}
 else if(d.plan){UI.plan[d.plan]=true;render();toastMsg('Engagement action added to the plan');}
 else if(d.engage){toastMsg(`Engagement request sent to the MSL team for ${hcp(d.engage).name}`);t.disabled=true;t.textContent='Requested ✓';}
 else if(d.schedule){schedule(hcp(d.schedule));}
 else if(d.prof){UI.prof=d.prof;render();}
 else if(d.act){
  const a=d.act;
  if(a==='play'){setRunning(!S.running);}
  else if(a==='startlive'){setRunning(true);toastMsg('Live feed started · every page now updates as signals arrive');}
  else if(a==='goto-live'){nav('live-feed');}
  else if(a==='step'){process1();}
  else if(a==='ff'){fastForward();}
  else if(a==='reset'||a==='reset2'){const b=$('resetbtn');if(!b.dataset.arm){b.dataset.arm='1';b.querySelector('.lbl').textContent='Click again';toastMsg('Click Reset again to return to the 1 Oct refresh');setTimeout(()=>{delete b.dataset.arm;b.querySelector('.lbl').textContent='Reset';},2500);return;}
   delete b.dataset.arm;b.querySelector('.lbl').textContent='Reset';clearTimeout(S.timer);initStore();UI.chat=[];UI.plan={};closeDrawer();updateChrome();render();toastMsg('Reset to the 1 Oct quarterly refresh. No new signals yet.');}
  else if(a==='export'){exportCsv();}
  else if(a==='period'){const l=$('periodlbl');if(l)l.textContent=l.textContent==='Q4 2026'?'Q3 2026':'Q4 2026';}
  else if(a==='runeng'){runEngine();}
  else if(a==='close'){closeDrawer();}
  else if(a==='menu'){$('sidebar').classList.toggle('open');}
  else if(a==='bell'){UI.popover=!UI.popover;S.unread=0;updateChrome();const p=$('popover');p.hidden=!UI.popover;p.innerHTML=`<strong>Scientific intelligence updates</strong>${S.alerts.length?S.alerts.slice(0,4).map(x=>`<p><span class="badge green">New</span> <b>${esc(x.title)}</b><br>${esc(x.why)}</p>`).join(''):'<p><span class="badge green">New</span> 5 physicians have rapidly increasing engagement.</p><p>3 KOLs published new research this month.</p>'}<p><button class="link-action" type="button" data-route="live-feed">Open live intelligence feed ${ic('right')}</button></p>`;e.stopPropagation();}
  else if(a==='boot'){boot();}
  else if(a==='mclose'){$('modal').innerHTML='';}
  else if(a==='msave'){$('modal').innerHTML='';toastMsg('Scientific exchange scheduled (demo)');}
 }
});
document.addEventListener('change',e=>{
 const id=e.target.id,v=e.target.value;
 if(id==='d-region'){UI.dash.region=v;render();}
 else if(id==='d-spec'){UI.dash.spec=v;PAGES.dashboard.live();}
 else if(id==='d-period'){UI.dash.period=v;PAGES.dashboard.live();}
 else if(id.startsWith('x-')&&id!=='x-q'){const k={'x-region':'region','x-spec':'spec','x-prio':'prio','x-score':'score','x-pubs':'pubs','x-trials':'trials'}[id];UI.ex[k]=id==='x-trials'?e.target.checked:v;PAGES.explorer.live();}
 else if(id==='l-region'){UI.lb.region=v;PAGES.leaderboard.live();}
 else if(id==='l-sort'){UI.lb.sort=v;PAGES.leaderboard.live();}
 else if(id==='s-live'){setRunning(e.target.checked);}
 else if(id==='h-sel'){R.sel=+v;PAGES.engine.mountSub();}
});
document.addEventListener('input',e=>{if(e.target.id==='x-q'){UI.ex.q=e.target.value;PAGES.explorer.live();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();$('modal').innerHTML='';}});
setInterval(()=>{if(S.running&&R.route==='dashboard'&&$('d-upd'))$('d-upd').textContent='Updated live · '+fmtT(S.clock);},1000);

function exportCsv(){
 const rows=ranking().map((h,i)=>[i+1,h.name,h.inst,h.region,h.align.toFixed(1),h.alignDec,h.dyn.toFixed(1),dec(h.dyn),prio(h.dyn)]);
 const csv=[['Rank','Physician','Institution','Region','Alignment score','Alignment decile','Dynamic score','Dynamic decile','Priority'],...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
 try{const b=new Blob([csv],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='IBD-scientific-engagement-report.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toastMsg('Report exported: live ranking of 20 HCPs (CSV)');}catch(_){toastMsg('Export is not available in this browser');}
}
function runEngine(){
 if(UI.engRun)return;UI.engRun=true;UI.engStep=0;render();
 const t=setInterval(()=>{if(UI.engStep>=5){clearInterval(t);UI.engStep=6;UI.engRun=false;if(R.route==='engine'&&R.etab==='overview')render();toastMsg('AI analysis complete · live signals included');return;}UI.engStep++;if(R.route==='engine'&&R.etab==='overview')render();},850);
}
function schedule(h){
 $('modal').innerHTML=`<div class="modal-backdrop" data-act="mclose"><div class="modal" role="dialog" aria-label="Plan engagement" onclick="event.stopPropagation()"><h2>Plan scientific exchange</h2><p class="muted" style="font-size:11.5px">${esc(h.name)} · ${esc(h.inst)} · decile ${h.alignDec} → ${dec(h.dyn)}</p>
 <label for="m-type">Engagement type</label><select id="m-type"><option>Scientific exchange (MSL)</option><option>Advisory board invitation</option><option>Congress meeting · UEG Week</option></select>
 <label for="m-date">Preferred date</label><input id="m-date" type="date" value="2026-10-20"><label for="m-notes">Topics</label><textarea id="m-notes" rows="3">${esc(h.events[0]?h.events[0].detail:'Evolving treatment sequencing in IBD')}</textarea>
 <div class="modal-actions"><button class="btn" type="button" data-act="mclose">Cancel</button><button class="btn primary" type="button" data-act="msave">Schedule</button></div></div></div>`;
}
function boot(){
 const b=$('boot');b.hidden=false;const list=SOURCES;
 b.innerHTML=`<div class="bootbox"><span class="eyebrow" style="color:#ffb3bd;margin:0">Connection check · synthetic data</span><h2>Connecting to enterprise data sources</h2><p>Loading the quarterly alignment model and building unified HCP profiles.</p><div class="blist">${list.map((s,i)=>`<div class="bl" id="b${i}"><span class="st"></span><span>${esc(s.name)}</span><span class="c" id="bc${i}">waiting</span></div>`).join('')}<div class="bl" id="bx"><span class="st"></span><span>Unified HCP profiles and scores</span><span class="c" id="bcx">waiting</span></div></div><div style="display:flex;gap:8px"><button class="btn" type="button" id="bgo" hidden>Done</button><button class="btn" type="button" id="bskip" style="background:transparent;color:#fff">Skip</button></div></div>`;
 let i=0,done=false;const fin=()=>{done=true;b.hidden=true;};$('bskip').onclick=fin;
 const st=()=>{if(done)return;if(i>0){$('b'+(i-1)).className='bl done';$('bc'+(i-1)).textContent=fmtN(S.rec[list[i-1].name])+' records';}
  if(i<list.length){$('b'+i).className='bl on';$('bc'+i).textContent='syncing…';i++;setTimeout(st,300);}else{$('bx').className='bl on';setTimeout(()=>{if(done)return;$('bx').className='bl done';$('bcx').textContent=HCPS.length+' HCPs scored';$('bgo').hidden=false;$('bskip').hidden=true;$('bgo').onclick=fin;},600);}};
 setTimeout(st,300);
}

/* ======================= boot ======================= */
document.querySelector('[data-act="menu"]').innerHTML=ic('menu');
$('bell').innerHTML=ic('bell');$('ic-step').innerHTML=ic('step');$('ic-ff').innerHTML=ic('ff');$('ic-reset').innerHTML=ic('reset');
initStore();parseHash();updateChrome();render();
</script>
</body>
